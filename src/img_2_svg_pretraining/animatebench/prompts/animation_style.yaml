      },
      "active_group_colorization": {
        "reasoning": "Detailed rationale checking that active elements cleanly transition to color.",
        "followed": true
      },
      "color_match_and_anti_hallucination": {
        "reasoning": "Detailed rationale verifying the revealed colors match the original image. Explicitly state if the original was black-and-white and verify no artificial hues were hallucinated.",
