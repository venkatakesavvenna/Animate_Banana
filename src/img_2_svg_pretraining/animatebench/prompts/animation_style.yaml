schema_hopping_bounding_box: |
  {
    "frame_label": "string - frame filename or index",
    "generic_quality_checks": {
      "artifact_free": {
        "reasoning": "Detailed rationale verifying the complete absence of blur or rendering artifacts in this frame.",
        "followed": true
      },
      "visual_integrity": {
        "reasoning": "Detailed rationale checking if text and shapes remain uncorrupted.",
        "followed": true
      }
    },
    "style_specific_checks": {
      "discrete_placement": {
        "reasoning": "Detailed rationale confirming the box is cleanly placed on an element and not sliding through open space.",
        "followed": true
      },
      "box_transparency": {
        "reasoning": "Detailed rationale verifying the interior of the box does not artificially dim or obscure the elements beneath it.",
        "followed": true
      },
      "clean_enclosure": {
        "reasoning": "Detailed rationale checking if the box fits well without cutting into nodes or leaving parts spilling outside.",
        "followed": true
      },
      "no_text_overlap": {
        "reasoning": "Detailed rationale confirming the stroke of the bounding box never strikes through textual labels.",
        "followed": true
      },
      "mobile_boxes_static_elements": {
        "reasoning": "Detailed rationale comparing the current frame to the PREVIOUS frame, confirming every diagram element sits at the exact same position and size in both, and that the ONLY thing that moved is the bounding box. If this is the first frame, state that the rule is not applicable.",
        "followed": true
      }
    },
    "frame_verdict": "ACCEPT"
  }

