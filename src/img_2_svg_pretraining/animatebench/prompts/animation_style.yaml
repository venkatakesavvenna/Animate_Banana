      },
      "cumulative_effect": {
        "reasoning": "Detailed rationale confirming, against the ORIGINAL image, that no coloured element appears reverted or partially decoloured.",
        "followed": true
      },
      "no_color_bleeding": {
        "reasoning": "Detailed rationale checking that color application respects element boundaries tightly.",
        "followed": true
      }
