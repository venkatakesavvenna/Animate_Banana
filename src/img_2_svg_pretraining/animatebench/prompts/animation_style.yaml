# Ani-Style Compliance Score (ASCS) -- Elimination 2.
#
# Transcribed from the ASCS design document. The document shows the judge the
# original image followed by EVERY frame in chronological order and asks for a
# `frame_evaluations` array plus one `overall_verdict`. We call the judge once
# per frame instead: each call sees the original figure and ONE frame, plus a
# short note of where that frame sits in the sequence, and returns the
# evaluation of that frame alone. The overall verdict is aggregated in Python.
#
# The document repeats an identical generic body for all five styles; only the
# `*** <STYLE> RULES ***` block and the `style_specific_checks` object of the
# schema vary. Those two are factored out here as `adapter_*` and `schema_*`.
#
# REVISED 2026-08-19: each call now sees the ORIGINAL image, the PREVIOUS
# frame and the CURRENT frame -- three images, not two. Every style has at
# least one rule that is a claim about change (persistence, cumulative effect,
# opacity stability, "only the box moved"), and asking that while showing a
# single frame invites an invented answer: the judge cannot see what changed,
# but nothing stops it asserting that something did.
#
# The FIRST frame has no predecessor. It is sent with two images and an
# explicit note that the temporal rules are not applicable, rather than
# receiving the original image as a stand-in predecessor -- frame 1
# legitimately shows far less than the original, so that substitution would
# read as a mass persistence violation on every sequence's first frame.
#
# `frames` carries {style_name}, {frame_context}, {previous_note},
# {style_adapter} and {output_schema}.

frames: |
  You are an expert Animation Style Verifier. Your objective is to determine if the "{style_name}" animation style has been correctly and consistently applied to a diagram on a per-frame basis, and whether the overall output is acceptable.

  You are provided with, in this order:
  1. The ORIGINAL fully-revealed diagram image (ground truth layout).
  2. The PREVIOUS frame in the sequence (the state before this one). {previous_note}
  3. The CURRENT frame under evaluation ({frame_context}).

  You are a highly strict judge. Evaluate the CURRENT frame against the original image and, where a rule calls for it, directly against the PREVIOUS frame, using the generic quality checks and style-specific rules below. Rules are about the CURRENT frame; the previous frame is evidence, not the subject.

  The CRITICAL factors must heavily influence the final verdict.

  *** GENERIC QUALITY RULES ***
  1. Artifact-Free: The frame must not introduce any blur, jitter, or rendering artifacts.
  2. Visual Integrity: Elements must remain fully recognizable. There must be no corruption of text or shapes due to rendering.

  {style_adapter}

  *** OUTPUT REQUIREMENT ***
  Output ONLY valid JSON matching the exact schema below, describing this single frame. Provide a lengthy, deeply reasoned rationale for EVERY rule on this frame before marking whether it was followed (`true` or `false`). Set the `frame_verdict` to "ACCEPT" only if all rules are followed for that frame, otherwise "DISCARD". Discard immediately if the critical rules are not followed.

  ```json
  {output_schema}
  ```

adapter_progressive_reveal: |
  *** PROGRESSIVE REVEAL RULES ***
  1. Cumulative Addition (CRITICAL): The elements present in the current frame must represent a logical cumulative addition from the previous frames.
  2. Absolute Persistence (Temporal Comparison) (CRITICAL): The animation effect is strictly cumulative. You MUST actively compare the current frame to the PREVIOUS frame. Any element (node, block, text, arrow) that was fully visible in the previous frame MUST still be fully visible in its exact location in the current frame. If anything vanishes, gets deleted, or drops out, this rule is violated.
  3. No Masking/Hiding: Nothing should be hidden, dimmed, or masked. Elements must remain at full visibility.
  4. No Premature Floating Elements (CRITICAL): Arrows, text, or floating nodes must not be visible out of context in distant parts of the diagram before their logical reveal.

adapter_alpha_masking: |
  *** ALPHA MASKING RULES ***
  1. Fade-in Reveal: The currently active elements in the frame must be clearly visible/fading in to full opacity.
  2. Background Masking: Previously active elements (or inactive elements) must be masked to a lower opacity to emphasize the active group.
  3. Semantic Persistence (CRITICAL): Parent containers or background contextual elements must correctly persist across the frame without vanishing completely.
  4. Opacity Maintenance (Temporal Comparison) (CRITICAL): Opacity levels must be stable and must only change for elements this step is actively revealing. You MUST actively compare the current frame to the PREVIOUS frame: an element that was masked/dimmed must not have flickered to full opacity without being the new active group, and a fully-opaque element must not have been dimmed unless the active group legitimately moved on.

adapter_colour_pop: |
  *** COLOUR POP RULES ***
  1. Grayscale Integrity (CRITICAL): All non-active and unrevealed areas of the diagram must be strictly greyscale.
  2. Active Group Colorization: The active element/group in the frame must be fully colored.
  3. Color Match & Anti-Hallucination (CRITICAL): The colors appearing in the frame must logically match the original diagram. Mild variations in tint, brightness, or saturation are acceptable. However, generating completely new hues is a strict violation. If the Original Image is strictly black-and-white, the animation MUST NOT invent and apply new colors (e.g., suddenly coloring a box blue); doing so is a hallucination and an immediate failure.
  4. Cumulative Effect (Temporal Persistence) (CRITICAL): The color effect builds up and never resets. You MUST actively compare the current frame to the PREVIOUS frame. Any element that had color in the previous frame MUST still have color in the current frame. If an element reverts from colored back to greyscale, this rule is violated.
  5. No Color Bleeding: Colors must strictly stay within the bounds of their defined elements and not bleed into the background.

adapter_hopping_bounding_box: |
  *** HOPPING BOUNDING BOX RULES ***
  1. Discrete Placement (HIGHLY CRITICAL): The bounding box in the frame must be definitively placed over a target element. It must NOT be caught in-between two elements or on any arrows. If the bounding box is seen in between two elements or not on arrows. It would mean a sliding bounding box is implemented, and the style should immediately suffer an overall DISCARD. No need to go over the rest of the criteria.
  2. Box Transparency (CRITICAL): The interior of the bounding box must be strictly transparent (not opaque) and must not obscure the elements beneath it.
  3. Clean Enclosure (CRITICAL): The box must be undistorted and cleanly enclose the target elements. It should not cut through the element, and the element should not spill out.
  4. No Text Overlap: The bounding box stroke/lines must not overlap with, strike through, or cover any textual label.
  5. Mobile Boxes, Static Elements (Temporal Comparison) (CRITICAL): There should not be any displacement of any diagram element. You MUST actively compare the current frame to the PREVIOUS frame: every diagram element must sit at the exact same position and size in both. The ONLY thing permitted to have moved is the bounding box itself.

adapter_sliding_bounding_box: |
  *** SLIDING BOUNDING BOX RULES ***
  1. Smooth Transition Integrity (CRITICAL): The bounding box may be mid-slide across the canvas. While in transit, it must maintain its structural shape and not warp or distort heavily.
  2. Box Transparency (CRITICAL): The interior of the bounding box must be strictly transparent (not opaque) and must not obscure the elements or background beneath it.
  3. Clean Enclosure (HIGHLY CRITICAL): If the box is at rest over a target in this frame, it must cleanly enclose the target elements without cutting through them or letting them spill out.
  4. No Text Overlap (At Rest): If the box is at rest over a target in this frame, the bounding box stroke/lines must not strike through or cover any textual label.
  5. Hopping Boxes (HIGHLY CRITICAL): There must at least be one frame where the sliding box is shown in-between elements and not ON any element in particular. If all frames are on particular elements, then the overall style should be discarded even if all other conditions are met.
  6. Mobile Boxes, Static Elements (Temporal Comparison) (CRITICAL): There should not be any displacement of any diagram element. You MUST actively compare the current frame to the PREVIOUS frame: every diagram element must sit at the exact same position and size in both. The ONLY thing permitted to have moved is the bounding box itself.

schema_progressive_reveal: |
  {
    "frame_label": "string - frame filename or index",
    "generic_quality_checks": {
      "artifact_free": {
        "reasoning": "Detailed rationale verifying the complete absence of blur or rendering artifacts in this frame.",
        "followed": true
      },
      "visual_integrity": {
        "reasoning": "Detailed rationale checking if text and shapes remain uncorrupted.",
        "followed": true
      }
    },
    "style_specific_checks": {
      "cumulative_addition": {
        "reasoning": "Detailed rationale confirming elements appear incrementally in logical groups.",
        "followed": false
      },
      "absolute_persistence": {
        "reasoning": "Detailed rationale confirming, against the ORIGINAL image, that no element appears half-erased, dropped out, or truncated relative to what this frame has revealed.",
        "followed": true
      },
      "no_masking_or_hiding": {
        "reasoning": "Detailed rationale verifying no elements are partially masked or hidden.",
        "followed": false
      },
      "no_premature_floating_elements": {
        "reasoning": "Detailed rationale confirming no arrows, text, or unrelated nodes hover in the background out of sequence.",
        "followed": true
      }
    },
    "frame_verdict": "ACCEPT"
  }

schema_alpha_masking: |
  {
    "frame_label": "string - frame filename or index",
    "generic_quality_checks": {
      "artifact_free": {
        "reasoning": "Detailed rationale verifying the complete absence of blur or rendering artifacts in this frame.",
        "followed": true
      },
      "visual_integrity": {
        "reasoning": "Detailed rationale checking if text and shapes remain uncorrupted.",
        "followed": true
      }
    },
    "style_specific_checks": {
      "fade_in_reveal": {
        "reasoning": "Detailed rationale confirming active elements are properly opaque.",
        "followed": true
      },
      "background_masking": {
        "reasoning": "Detailed rationale verifying that inactive groups step down in opacity correctly.",
        "followed": true
      },
      "semantic_persistence": {
        "reasoning": "Detailed rationale observing how parent containers or logical background elements are handled.",
        "followed": true
      },
      "opacity_maintenance": {
        "reasoning": "Detailed rationale checking that masked areas do not accidentally turn opaque and transparency is stable.",
        "followed": true
      }
    },
    "frame_verdict": "ACCEPT"
  }

schema_colour_pop: |
  {
    "frame_label": "string - frame filename or index",
    "generic_quality_checks": {
      "artifact_free": {
        "reasoning": "Detailed rationale verifying the complete absence of blur or rendering artifacts in this frame.",
        "followed": true
      },
      "visual_integrity": {
