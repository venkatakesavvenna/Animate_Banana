output_format: |
  Respond in EXACTLY this structure, with these literal section headers:

  ### RATIONALE
  <Write a thorough step-by-step rationale. First identify what is NEWLY TARGETED in the current frame relative to the previous frame according to the Style Adapter, mapping it to specific XML IDs. Then analyze Criterion A (element appropriateness) referencing specific XML ids and what was already targeted. Then analyze Criterion B (group coherence) referencing specific XML ids and any relevant edges. Then explain how you combined them into the final band using the tie-break rule.>

  ### CRITERION_A_BAND: <integer 0-4, your standalone judgment for Criterion A only>
  ### CRITERION_B_BAND: <integer 0-4, your standalone judgment for Criterion B only>
  ### FINAL_BAND: <integer 0-4, the combined band per the tie-break rule>
  ### LABEL: <one of: Fully Sensible | Minor Deviation | Moderate Violation | Major Violation | Severe Violation>

  Do not output anything after the LABEL line.
