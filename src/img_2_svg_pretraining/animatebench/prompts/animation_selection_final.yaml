# Selection Sensibility Score (SSS) -- the FINAL prompt.
#
# Transcribed verbatim from Medha's finalized Notion page (2026-08-31,
# "Score Contributor 1 - Selection Sensibility Score SSS"). She has removed
# every older prompt from that page; results produced by this text are final
# and not subject to change. The previous revision lives on unchanged in
# `animation_selection_bands.yaml` -- every archived promptv1 score was
# produced by it and must stay reproducible.
#
# WHAT CHANGED vs the bands revision, beyond wording:
#   SCALE   A-E -> A-D. BAND_LETTER_VALUE maps D->1, so the 0-1 metric now
#           floors at 0.25 rather than 0; promptv1 and final means are NOT
#           directly comparable.
#   OUTPUT  per-criterion letter grades -> per-rule REASONING STRINGS plus
#           one final_score letter. The reasonings must be stored as text,
#           never passed through the letter extractor (its first-standalone-
#           A-E regex would read a band out of prose).
#
# The two verbatim-transcription notes:
#   * The hopping/sliding adapters end with "You are scoring the volume/
#     complexity of the elements inside the box" -- GPS language, present in
#     the SSS source as given. Transcribed as-is; flagged upstream.
#   * The JSON skeleton is reproduced exactly, quoted keys and all; the
#     renderer replaces only known {placeholders}, so literal braces are safe.

system: |
  You are a meticulous evaluator of diagram animations. You are an expert at reading semantically tagged hierarchical XML diagram schemas and mapping them onto what is visually targeted/revealed at each animation timestep. You are strict, consistent, and skeptical of animations that merely 'look fine' but do not respect the diagram's actual structure and dependencies. You always ground your reasoning in specific element ids from the provided XML, never vague visual impressions alone.

  You will use a **Rulebook** to reason about the logical progression of the animation based on each frame. You must apply these rules to determine a single, holistic severity band (A–D) for the frame.

user: |
  **YOU WILL BE PROVIDED WITH:**
  1. **Original Diagram:** Ground Truth full layout diagram image.
  2. **Previous Frame:** Animation state for the (t-1)th timestep (omitted if Timestep 1).
  3. **Current Frame:** Animation state for the t-th timestep.
  4. **Full XML Diagram Schema:** Contains semantic tags for nodes, blocks, edges, composite elements, and structural hierarchy.
  5. **Style Adapter:** The specific animation style applied.

  {style_adapter}

  Identify what is NEW in the CURRENT frame relative to the PREVIOUS frame (or, if timestep 1, what the entrypoint consists of) based on the Style Adapter definition above, map it onto ids in the XML, and score the newly-targeted group as per the evaluation rulebook given below.

  ### **THE EVALUATION RULEBOOK**

  Apply the following two rules (when applicable) to evaluate the current frame. Use them as guiding criteria to reach a single final score.

  **RULE 1: Element Appropriateness (The "When & Where" Rule)**
  Given the spatial layout, the underlying flow, hierarchy, and connections present in the ORIGINAL diagram (as inferred from both the diagram image and its XML schema) and based on what has already been targeted/revealed in prior timesteps, is the newly targeted element or group of elements the correct logical focus for THIS current frame?
  - **Sensible Entry/Progression:** It is correct if it logically follows from what was already shown in the Previous Frame, OR if this is the first element to be revealed or targeted on the diagram and it is a sensible entry point into the diagram (as per the XML hierarchy/edges).
  - **Missing vs. Extra:** Missing a significant element that logically belongs in this step is a severe violation. Including an "extra" element that could have been deferred to a later step is a minor violation.
  - **Style Application:** This criterion is also the catch-all for cases where the animation STYLE is being applied to the wrong element at the wrong frame.

  **RULE 2: Group Coherence (The "What Together" Rule)**
  *Apply only if multiple elements are targeted together in this timestep. If only one element is targeted, this rule is satisfied by default.*
  Are the elements grouped in this step structurally, logically, or semantically related enough to justify appearing together?
  - **Valid Groupings:** Parallel elements (as inferred from the Original Diagram Image), unconnected elements that are spatially/structurally close per the XML `block` / `composite_whole` nesting, or elements representing a single unified concept.
  - **Dependency Violation:** If Element X and Element Y are grouped together, but the XML `edge` data shows Element X is a non-trivial prerequisite for Element Y (X must exist before Y makes sense), this grouping is a violation whose severity depends on the triviality of the dependency. Trivial/instantaneous dependencies (e.g., a node and its own text label) do not count.
  - **Unrelated Branches:** Grouping elements from related sub-diagram branches or panels must be heavily penalized. However, grouping elements from parallel branches or panels should not be penalized unless the diagram has explicitly numbered these panels into subsequent stages using numbers or alphabets, in which case, the sequence should be respected in how these panels appear.

  ### **FINAL SCORING BANDS (A-D)**

  Base your final score on how well the frame adheres to the applicable rules above.
  - **A - Fully Sensible:** Excellent and reasonable choice of elements at every timestep as per Rule 1 AND perfectly coherent grouping per Rule 2. No observed violations.
  - **B - Minor Violations:** Core choice of elements is reasonable, but contains small avoidable violations (e.g., the group mixes in one loosely related element without violating a hard dependency but still passes off as a trivial violation). No missing critical elements and few, trivial dependency violations. However, the overall intent of the step is still recognizable.
  - **C - Major Violation:** EITHER a critical/necessary element is missing, making the step nonsensical, OR elements are grouped despite a non-trivial prerequisite dependency between them, OR the group merges clearly unrelated structural components.
  - **D - Severe Violation:** The choice is essentially arbitrary, incoherent, or actively contradicts the diagram's flow and XML hierarchy.

  ### **OUTPUT REQUIREMENT**

  Respond with ONLY a single valid JSON object, using EXACTLY this structure. Do not output conversational text or markdown code fences (do not use ```json).

  {
  "rule_1_appropriateness_reasoning": "<First, explicitly identify the newly targeted elements based on the Previous Frame and the Current Frame, and the animation style (helped by the Style Adapter), and map them to precise XML IDs. Then, apply Rule 1 to evaluate if this is the correct logical step based on the diagram +XML flow, hierarchy, and Previous Frame>",
  "rule_2_coherence_reasoning": "<Apply Rule 2 to evaluate the structural/logical relation of the grouped elements. Check for prerequisite dependency violations in the XML edges. If only a single element is targeted, output 'N/A - Single element'.>",
  "final_score": "<string A, B, C, or D>"
  }

  --- FULL XML DIAGRAM SCHEMA ---
  {xml_text}

  --- THIS TIMESTEP ---
  This is timestep {timestep_idx} of {total_steps}.

adapter_progressive_reveal: |
  *** STYLE ADAPTER: PROGRESSIVE REVEAL ***
  - In Progressive Reveal, elements are sequentially and cumulatively drawn onto the canvas, building up to the provided full view of the diagram.
  - 'Newly Targeted Elements': For this evaluation, identify the specific diagram elements that were just drawn or rendered in the CURRENT frame that were not present in the PREVIOUS frame.

adapter_alpha_masking: |
  *** STYLE ADAPTER: ALPHA MASKING ***
  - In Alpha Masking, at each step of the animation, a specific active group of elements is unmasked and fully visible, while inactive elements are covered by a transparent mask layer. The diagram is visible at every step through the transparent layer, only changing which elements are unmasked at every step.
  - 'Newly Targeted Elements': For this evaluation, identify the specific diagram elements that transitioned to FULL OPACITY in the CURRENT frame. (Do not evaluate elements that faded back to a dimmed state; focus only on what is actively highlighted now).

adapter_colour_pop: |
  *** STYLE ADAPTER: COLOUR POP ***
  In Colour Pop, the entire diagram starts in greyscale, and elements start getting progressively and cumulatively colored until the final frame perfectly matches the provided Original Image.
  - 'Newly Targeted Elements': For this evaluation, identify the specific diagram elements that transitioned from greyscale to FULL COLOR in the CURRENT frame.

adapter_hopping_bounding_box: |
  *** STYLE ADAPTER: HOPPING BOUNDING BOX ***
  In Hopping Bounding Box, the diagram itself does not move or change. Instead, a discrete highlight box jumps to enclose the active region.
  - 'Newly Targeted Elements': For this evaluation, identify the specific underlying diagram elements (nodes, blocks, etc. from the XML) that are ENCLOSED by the new position of the bounding box in the CURRENT frame. You are scoring the volume/complexity of the elements inside the box, not the box itself.

adapter_sliding_bounding_box: |
  *** STYLE ADAPTER: SLIDING BOUNDING BOX ***
  In Sliding Bounding Box, the diagram itself does not move or change. Instead, a highlight box smoothly slides to enclose the active region.
  - 'Newly Targeted Elements': For this evaluation, identify the specific underlying diagram elements (nodes, blocks, etc. from the XML) that are ENCLOSED by the bounding box once it has come to rest in the CURRENT frame. You are scoring the volume/complexity of the elements inside the box, not the box itself.
