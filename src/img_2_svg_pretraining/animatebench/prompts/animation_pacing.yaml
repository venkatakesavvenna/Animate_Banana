output_format: |
  Respond in EXACTLY this structure, with these literal section headers:

  ### RATIONALE
  <Write a thorough step-by-step rationale. First identify what is NEWLY TARGETED in the current frame relative to the previous frame according to the Style Adapter, mapping it to specific XML IDs. Then analyze Volume (how many elements/groups were targeted at this step, and whether that count is digestible or an overload). Then analyze Complexity (whether any targeted element is intrinsically complex per the XML signals). Then explain how you combined them into the final band using the tie-break rule.>

  ### VOLUME_BAND: <integer 0-4, your standalone judgment for Volume only>
  ### COMPLEXITY_BAND: <integer 0-4, your standalone judgment for Complexity only>
  ### FINAL_BAND: <integer 0-4, the combined band per the tie-break rule>
  ### LABEL: <one of: Well-Paced | Minor Overload | Moderate Overload | Major Overload | Severe Overload>

  Do not output anything after the LABEL line.
