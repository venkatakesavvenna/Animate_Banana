output_format: |
  Respond in EXACTLY this structure, with these literal section headers:

  ### RATIONALE
  <Write a thorough step-by-step rationale.
  1. Identify what is NEWLY TARGETED in the current frame mapping to XML IDs.
  2. Analyze Volume (count and base digestability).
  3. Analyze Complexity (intrinsic XML structure/edges).
  4. Analyze Relevance (is this grouping contextually necessary to preserve explanatory flow, especially for composite elements?).
  5. Explain how you applied the tie-break rule and Relevance Shield to reach the final band.>

  ### VOLUME_BAND: <integer 0-4>
  ### COMPLEXITY_BAND: <integer 0-4>
  ### RELEVANCE_BAND: <integer 0-4>
  ### FINAL_BAND: <integer 0-4>
  ### LABEL: <one of: Well-Paced | Minor Overload | Moderate Overload | Major Overload | Severe Overload>

  Do not output anything after the LABEL line.
