<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Inspector</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --panel2: #23272f; --line: #2f343d;
    --fg: #e6e8ec; --dim: #949aa6; --accent: #6ea8fe; --ok: #4ec9a0;
    --warn: #e0af68; --bad: #f07178;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); display: flex; height: 100vh;
         font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  code, pre { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  /* sidebar */
  #side { width: 270px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
          display: flex; flex-direction: column; }
  #side h1 { font-size: 13px; margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line);
             letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
  #meta { padding: 10px 16px; font-size: 11px; color: var(--dim); border-bottom: 1px solid var(--line);
          line-height: 1.7; }
  #meta b { color: var(--fg); font-weight: 500; }
  #list { overflow-y: auto; flex: 1; }
  .item { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: var(--panel2); }
  .item.active { background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); }
  .item .id { font-family: ui-monospace, monospace; font-size: 12px; }
  .item .sub { font-size: 11px; color: var(--dim); margin-top: 3px;
               display: flex; gap: 8px; align-items: center; }
  .bar { flex: 1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--ok); }

  /* main */
  #main { flex: 1; overflow-y: auto; padding: 20px 24px 60px; }
  #empty { color: var(--dim); padding: 40px; text-align: center; }
  h2 { font-size: 16px; margin: 0 0 4px; }
  .sub2 { color: var(--dim); font-size: 12px; margin-bottom: 18px; }

  .row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
          padding: 12px; flex: 1; min-width: 280px; }
  .card h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
             color: var(--dim); margin: 0 0 10px; font-weight: 600; }
  .card img { max-width: 100%; border-radius: 4px; background: #fff; display: block; }

  /* stage table */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); font-size: 12px; }
  th { color: var(--dim); font-weight: 500; font-size: 11px; text-transform: uppercase;
       letter-spacing: .04em; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--panel2); }
  .tag { font-family: ui-monospace, monospace; font-size: 11px; color: var(--accent); }
  .yes { color: var(--ok); } .no { color: var(--bad); }

  pre.view { background: #101216; border: 1px solid var(--line); border-radius: 6px;
             padding: 12px; overflow-x: auto; max-height: 460px; overflow-y: auto;
             font-size: 11.5px; white-space: pre; margin: 0; }

  /* sequence steps */
  .step { border-left: 2px solid var(--accent); padding: 6px 0 6px 12px; margin-bottom: 10px; }
  .step .h { font-family: ui-monospace, monospace; font-size: 11.5px; }
  .step .n { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .chip { display: inline-block; background: var(--panel2); border: 1px solid var(--line);
          border-radius: 3px; padding: 1px 6px; margin: 2px 3px 0 0;
          font-family: ui-monospace, monospace; font-size: 10.5px; color: var(--accent); }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 10.5px;
          background: var(--panel2); border: 1px solid var(--line); color: var(--dim); }

  /* frame scrubber */
  #frameimg { width: 100%; background: #fff; border-radius: 4px; }
  input[type=range] { width: 100%; margin-top: 10px; accent-color: var(--accent); }
  .dl a { color: var(--accent); text-decoration: none; margin-right: 14px; font-size: 12px; }
  .dl a:hover { text-decoration: underline; }
  .card h3 a { color: var(--accent); text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; }

  button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
           border-radius: 4px; padding: 4px 11px; font-size: 12px; cursor: pointer;
           font-family: inherit; }
  button:hover { border-color: var(--accent); }

  /* contact sheet */
  .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
           gap: 10px; max-height: 620px; overflow-y: auto; }
  .sheet figure { margin: 0; background: #fff; border: 1px solid var(--line);
                  border-radius: 4px; overflow: hidden; cursor: pointer; }
  .sheet figure:hover { border-color: var(--accent); }
  .sheet img { width: 100%; display: block; }
  .sheet figcaption { background: var(--panel2); color: var(--dim); font-size: 10.5px;
                      text-align: center; padding: 2px; font-family: ui-monospace, monospace; }
  code { background: var(--panel2); padding: 1px 5px; border-radius: 3px; font-size: 11px; }
</style>
</head>
<body>
<div id="side">
  <h1>Pipeline Inspector</h1>
  <div id="meta"></div>
  <div id="list"></div>
</div>
<div id="main"><div id="empty">Select a sample</div></div>

<script>
const $ = (s) => document.querySelector(s);
let CONFIG = null, CURRENT = null;

const esc = (s) => (s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const kb = (n) => n < 1024 ? n + " B" : (n/1024).toFixed(1) + " KB";

async function boot() {
  const data = await (await fetch("/api/samples")).json();
  CONFIG = data.config;
  $("#meta").innerHTML = `
    <div>style <b>${esc(CONFIG.style)}</b></div>
    <div>target <b>${esc(CONFIG.target)}</b></div>
    <div>config <b>${esc(CONFIG.fingerprint)}</b></div>`;
  $("#list").innerHTML = data.samples.map(s => `
    <div class="item" data-id="${s.id}">
      <div class="id">${esc(s.id)}</div>
      <div class="sub">
        <span>${s.done}/${s.total}</span>
        <span class="bar"><span style="width:${100*s.done/s.total}%"></span></span>
        <span>${s.frames ? s.frames + "f" : "&mdash;"}</span>
      </div>
    </div>`).join("");
  document.querySelectorAll(".item").forEach(el =>
    el.onclick = () => open(el.dataset.id));
  if (data.samples.length) open(data.samples[0].id);
}

async function open(id) {
  CURRENT = id;
  document.querySelectorAll(".item").forEach(el =>
    el.classList.toggle("active", el.dataset.id === id));
  const d = await (await fetch(`/api/sample/${id}`)).json();
  render(d);
  loadRasters(id);
}

async function loadRasters(id) {
  const r = await (await fetch(`/api/rasters/${id}`)).json();
  const host = $("#rasters");
  if (!host || !r.available) return;

  const rejected = (r.verified || []).filter(v => !v.accepted);
  host.innerHTML = `
    <div class="card" style="margin-bottom:22px">
      <h3>Stage 1b &mdash; raster integration
        <span class="pill" style="margin-left:6px">${r.proposals} proposed</span>
        <span class="pill">${r.accepted} verified</span>
        <span class="pill">${r.replaced.length}/${r.placeholders.length} filled</span></h3>

      <div class="sub2" style="margin:0 0 10px">
        Rejections are usually correct: line art a vector renderer can redraw is deliberately
        not spliced. A low fill count often means the transmuter over-used <code>raster_node</code>.
      </div>

      ${r.overlays.length ? `<div class="row" style="margin-bottom:14px">${
        r.overlays.map(n => `
          <div style="flex:1;min-width:260px">
            <div class="sub2" style="margin:0 0 4px">${esc(n.replace(".png",""))}</div>
            <img src="/api/raster-asset/${id}/${n}" style="width:100%;border-radius:4px;background:#fff">
          </div>`).join("")
      }</div>` : ""}

      ${r.crops.length ? `
        <div class="sub2" style="margin:0 0 6px">spliced crops</div>
        <div class="sheet" style="max-height:none;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${
          r.crops.map(n => `
            <figure>
              <img src="/api/raster-asset/${id}/${n}">
              <figcaption>${esc(n.replace("crop_","").replace(".png",""))}</figcaption>
            </figure>`).join("")
        }</div>` : ""}

      ${rejected.length ? `
        <div class="sub2" style="margin:12px 0 4px">rejected proposals</div>
        <table><tbody>${rejected.map(v => `
          <tr><td class="tag" style="width:50px">mark ${v.mark}</td>
              <td class="sub2" style="margin:0">${esc(v.note || "no reason given")}</td></tr>`).join("")}
        </tbody></table>` : ""}
    </div>`;
}

function render(d) {
  const seq = d.sequence;
  const nodes = seq?.nodes ?? [];
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const order = (seq?.traversal ?? []).map(t => byId[t]).filter(Boolean);

  $("#main").innerHTML = `
    <h2>${esc(d.id)}</h2>
    <div class="sub2">${esc(d.title || "")}${d.title ? " &middot; " : ""}tiers: ${d.tiers.join(", ")}</div>

    <div class="row">
      <div class="card"><h3>Source figure</h3>
        <img src="/api/figure/${d.id}"></div>
      <div class="card"><h3>Reconstructed (stage 1a)</h3>
        <img src="/api/render/${d.id}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'sub2',textContent:'not compiled'}))"></div>
    </div>

    ${d.exports.frames ? `
    <div class="card" style="margin-bottom:22px">
      <h3>Animation &mdash; ${d.exports.frames} frames
        <span style="float:right;text-transform:none;font-weight:400">
          <a href="#" onclick="setMode('scrub');return false" id="m-scrub">scrub</a> &middot;
          <a href="#" onclick="setMode('sheet');return false" id="m-sheet">contact sheet</a>
        </span></h3>

      <div id="scrubview">
        <img id="frameimg" src="/api/frame/${d.id}/0">
        <input id="frange" type="range" min="0" max="${d.exports.frames-1}" value="0"
               oninput="gotoFrame(+this.value)">
        <div style="display:flex;align-items:center;gap:10px;margin-top:8px">
          <button onclick="step(-1)">&#9664;</button>
          <button onclick="togglePlay()" id="playbtn">&#9654; play</button>
          <button onclick="step(1)">&#9654;</button>
          <span class="sub2" style="margin:0">frame <span id="fno">1</span> / ${d.exports.frames}
            &middot; <span class="pill">&larr; &rarr; arrow keys</span>
            &middot; <span class="pill">space to play</span></span>
        </div>
      </div>

      <div id="sheetview" style="display:none">
        <div class="sheet">${
          Array.from({length: d.exports.frames}, (_, i) => `
            <figure onclick="setMode('scrub');gotoFrame(${i})">
              <img loading="lazy" src="/api/thumb/${d.id}/${i}">
              <figcaption>${i+1}</figcaption>
            </figure>`).join("")
        }</div>
      </div>

      <div class="dl" style="margin-top:10px">${
        d.exports.files.map(f => `<a href="/api/export/${d.id}/${f.name}" download>${esc(f.name)} <span class="pill">${kb(f.size)}</span></a>`).join("")
      }</div>
      <div class="sub2" style="margin:8px 0 0;font-size:11px">frames on disk: <code>${esc(d.exports.dir)}/frames/</code></div>
    </div>` : ""}

    ${order.length ? `
    <div class="card" style="margin-bottom:22px">
      <h3>Animation sequence &mdash; ${order.length} steps
        <span class="pill" style="margin-left:6px">${esc(seq.traversal_style || "")}</span></h3>
      ${order.map((n,i) => `
        <div class="step">
          <div class="h">${i+1}. ${esc(n.id)}
            <span class="pill">d${n.depth}</span>
            <span class="pill">${esc(n.action || "")}</span>
            ${n.duration ? `<span class="pill">${n.duration}s</span>` : ""}</div>
          <div class="n">${esc(n.narration || "")}</div>
          <div>${(n.focus||[]).map(f => `<span class="chip">${esc(f)}</span>`).join("")}</div>
        </div>`).join("")}
    </div>` : ""}

    <div id="rasters"></div>

    <div class="card" style="margin-bottom:22px">
      <h3>Artifacts</h3>
      <table><thead><tr><th>Stage</th><th>Artifact</th><th>Size</th><th></th></tr></thead>
      <tbody>${d.stages.map((s,i) => `
        <tr class="${s.exists ? "clickable" : ""}" ${s.exists ? `onclick="show(${i})"` : ""}>
          <td class="tag">${s.stage}</td>
          <td>${esc(s.label)}</td>
          <td>${s.exists ? kb(s.size) : ""}</td>
          <td class="${s.exists ? "yes" : "no"}">${s.exists ? "&#10003;" : "&mdash;"}</td>
        </tr>`).join("")}</tbody></table>
    </div>

    <div id="viewer"></div>`;

  window.STAGES = d.stages;
  FRAMES = d.exports.frames;
  FRAME = 0;
  stopPlay();
  setMode(MODE);
  const first = d.stages.findIndex(s => s.exists);
  if (first >= 0) show(first);
}

/* -- frame navigation ------------------------------------------------- */
let FRAMES = 0, FRAME = 0, TIMER = null, MODE = "scrub";

function gotoFrame(i) {
  if (!FRAMES) return;
  FRAME = Math.max(0, Math.min(i, FRAMES - 1));
  const img = $("#frameimg");
  if (img) img.src = `/api/frame/${CURRENT}/${FRAME}`;
  const range = $("#frange");
  if (range) range.value = FRAME;
  const label = $("#fno");
  if (label) label.textContent = FRAME + 1;
}

function step(delta) { stopPlay(); gotoFrame(FRAME + delta); }

function togglePlay() { TIMER ? stopPlay() : startPlay(); }

function startPlay() {
  if (!FRAMES) return;
  // Loop rather than stop at the end -- the point is to watch the build-up
  // repeatedly, the same as the exported GIF does.
  TIMER = setInterval(() => gotoFrame(FRAME >= FRAMES - 1 ? 0 : FRAME + 1), 500);
  const btn = $("#playbtn");
  if (btn) btn.innerHTML = "&#10073;&#10073; pause";
}

function stopPlay() {
  if (TIMER) clearInterval(TIMER);
  TIMER = null;
  const btn = $("#playbtn");
  if (btn) btn.innerHTML = "&#9654; play";
}

function setMode(mode) {
  MODE = mode;
  if (mode === "sheet") stopPlay();
  const scrub = $("#scrubview"), sheet = $("#sheetview");
  if (scrub) scrub.style.display = mode === "scrub" ? "" : "none";
  if (sheet) sheet.style.display = mode === "sheet" ? "" : "none";
  ["scrub", "sheet"].forEach(m => {
    const el = $("#m-" + m);
    if (el) el.style.color = m === mode ? "var(--fg)" : "var(--accent)";
  });
}

document.addEventListener("keydown", (e) => {
  if (!FRAMES || MODE !== "scrub") return;
  if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  else if (e.key === " ") { e.preventDefault(); togglePlay(); }
});

function show(i) {
  const s = window.STAGES[i];
  if (!s?.exists) return;
  $("#viewer").innerHTML = `
    <div class="card"><h3>${esc(s.label)} &mdash; <span style="text-transform:none;font-weight:400">${esc(s.path)}</span></h3>
    <pre class="view">${esc(s.content)}</pre></div>`;
  $("#viewer").scrollIntoView({behavior: "smooth", block: "nearest"});
}

boot();
</script>
</body>
</html>
