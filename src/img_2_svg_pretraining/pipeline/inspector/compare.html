<title>AnimateBench — side by side</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --panel2: #23272f; --line: #2f343d;
    --fg: #e6e8ec; --dim: #949aa6; --accent: #6ea8fe; --ok: #4ec9a0;
    --warn: #e0af68; --bad: #f07178;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }

  header { padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
           position: sticky; top: 0; z-index: 10; }
  h1 { margin: 0 0 10px; font-size: 15px; font-weight: 600; letter-spacing: .2px; }
  .controls { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  label { color: var(--dim); font-size: 11px; text-transform: uppercase;
          letter-spacing: .6px; margin-right: 6px; }
  select, button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
                   border-radius: 4px; padding: 6px 10px; font-size: 12.5px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #10131a; border-color: var(--accent);
                   font-weight: 600; }

  main { padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 16px; margin-bottom: 20px; }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }

  .cell { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
          padding: 12px; min-width: 0; }
  .cell h3 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase;
             letter-spacing: .7px; color: var(--dim); font-weight: 600;
             display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .cell h3 .tag { text-transform: none; letter-spacing: 0; color: var(--accent);
                  font-family: ui-monospace, monospace; font-size: 11px; }
  video, .cell img { width: 100%; border-radius: 4px; background: #fff; display: block; }
  .missing { padding: 40px 12px; text-align: center; color: var(--dim);
             background: var(--panel2); border-radius: 4px; font-size: 12px; }
  .stats { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 10.5px;
          background: var(--panel2); border: 1px solid var(--line); color: var(--dim); }
  .pill.ok { color: var(--ok); border-color: #2c5c4c; }
  .pill.bad { color: var(--bad); border-color: #5c2f36; }
  .pill.warn { color: var(--warn); border-color: #5c4a2c; }
  .sub { color: var(--dim); font-size: 11px; margin-top: 6px; word-break: break-all; }
  .reviews { margin-top: 8px; font-size: 11px; color: var(--warn); }

  /* narration script, per panel */
  .script { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px;
            max-height: 260px; overflow-y: auto; }
  .script.collapsed { max-height: 0; padding-top: 0; border-top: none; overflow: hidden; }
  .step { display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px solid #23272f; }
  .step:last-child { border-bottom: none; }
  .step .t { flex: 0 0 22px; color: var(--accent); font-family: ui-monospace, monospace;
             font-size: 10.5px; padding-top: 1px; }
  .step .txt { flex: 1; font-size: 12px; line-height: 1.45; }
  .step .txt.silent { color: var(--dim); font-style: italic; }
  .step .ids { color: var(--dim); font-size: 10px; font-family: ui-monospace, monospace;
               margin-top: 2px; word-break: break-all; }
  .toggle { background: none; border: none; color: var(--accent); cursor: pointer;
            font-size: 11px; padding: 4px 0; text-align: left; }

  /* metrics block */
  .metrics { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  .msuite { margin-bottom: 10px; }
  .msuite > .h { color: var(--dim); font-size: 10px; text-transform: uppercase;
                 letter-spacing: .7px; margin-bottom: 4px; }
  .metric { display: flex; align-items: baseline; gap: 8px; padding: 3px 0;
            border-bottom: 1px solid #23272f; }
  .metric:last-child { border-bottom: none; }
  .metric .name { flex: 1; font-size: 12px; }
  .metric .val { font-family: ui-monospace, monospace; font-size: 13px;
                 font-weight: 600; min-width: 52px; text-align: right; }
  .metric .val.good { color: var(--ok); }
  .metric .val.mid  { color: var(--warn); }
  .metric .val.bad  { color: var(--bad); }
  .metric .why { color: var(--dim); font-size: 11px; line-height: 1.4;
                 margin: 0 0 4px 0; }
  .metric .q { color: var(--dim); cursor: help; font-size: 10px;
               border: 1px solid var(--line); border-radius: 50%;
               width: 14px; height: 14px; display: inline-flex;
               align-items: center; justify-content: center; flex: 0 0 14px; }
  .metric .q:hover { color: var(--accent); border-color: var(--accent); }
  .mrow { border-bottom: 1px solid #23272f; padding: 5px 0; }
  .mrow:last-child { border-bottom: none; }
  .caveat { color: var(--warn); font-size: 10.5px; margin-top: 2px; }

  /* tabs */
  .tabs { display: flex; gap: 4px; margin-left: auto; }
  .tab { background: none; border: 1px solid var(--line); border-radius: 4px 4px 0 0;
         color: var(--dim); padding: 6px 14px; cursor: pointer; font-size: 12.5px; }
  .tab.active { background: var(--bg); color: var(--fg); border-bottom-color: var(--bg);
                position: relative; top: 1px; }
  .view { display: none; }
  .view.active { display: block; }

  /* scoreboard table */
  .tblwrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line);
             border-radius: 6px; }
  table.score { border-collapse: collapse; width: 100%; font-size: 12px; white-space: nowrap; }
  table.score th, table.score td { padding: 5px 9px; border-bottom: 1px solid var(--line);
                                    border-right: 1px solid #23272f; text-align: right; }
  table.score th:first-child, table.score td:first-child { text-align: left;
    position: sticky; left: 0; background: var(--panel); z-index: 1; }
  table.score thead tr.grp th { text-align: center; color: var(--accent);
    background: var(--panel2); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  table.score thead tr.grp th:first-child { background: var(--panel2); }
  table.score thead tr.cols th { color: var(--dim); font-weight: 500; font-size: 10.5px; }
  table.score td.val { font-family: ui-monospace, monospace; }
  table.score td.val.good { color: var(--ok); }
  table.score td.val.mid  { color: var(--warn); }
  table.score td.val.bad  { color: var(--bad); }
  table.score td.err { color: var(--bad); font-style: italic; text-align: left; }
  table.score tbody tr:hover td { background: #20242c; }

  /* presentation panel */
  .talk .meta { font-size: 11px; color: var(--dim); margin-top: 6px; }
  .talk .meta a { color: var(--accent); }
  .talk .transcript { margin-top: 8px; max-height: 160px; overflow-y: auto;
    font-size: 11.5px; color: var(--dim); border-top: 1px solid var(--line); padding-top: 6px; }
</style>

<header>
  <h1>AnimateBench &mdash; reference vs pipeline</h1>
  <div class="controls">
    <span><label>Sample</label><select id="sample" onchange="onSampleOrStyleChange()"></select></span>
    <span><label>Style</label><select id="style" onchange="onSampleOrStyleChange()"></select></span>
    <button class="primary" onclick="playAll()">&#9654; play all</button>
    <button onclick="pauseAll()">&#10073;&#10073; pause</button>
    <button onclick="restartAll()">&#8635; restart</button>
    <span id="status" class="sub" style="margin:0"></span>
    <div class="tabs">
      <button class="tab active" id="tab-panels" onclick="showView('panels')">Panels</button>
      <button class="tab" id="tab-table" onclick="showView('table')">Scoreboard</button>
    </div>
  </div>
</header>

<main>
  <div id="view-panels" class="view active"><div id="grid" class="grid"></div></div>
  <div id="view-table" class="view">
    <div class="controls" style="margin-bottom:12px">
      <span><label>Model</label><select id="tbl-model" onchange="loadTable()"></select></span>
      <span id="tbl-status" class="sub" style="margin:0"></span>
    </div>
    <div class="tblwrap"><table class="score" id="scoreboard"></table></div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
let INDEX = null;

async function boot() {
  INDEX = await (await fetch("/api/index")).json();
  $("#sample").innerHTML = INDEX.samples
    .map(s => `<option value="${s.id}">${s.id}${s.has_reference ? "" : " (no reference)"}</option>`)
    .join("");
  $("#style").innerHTML = INDEX.styles.map(s => `<option value="${s}">${s}</option>`).join("");
  $("#tbl-model").innerHTML = INDEX.models
    .map(m => `<option value="${esc(m.label)}">${esc(m.label)}</option>`).join("");
  load();
}

function onSampleOrStyleChange() {
  load();
  if ($("#view-table").classList.contains("active")) loadTable();
}

function showView(name) {
  ["panels", "table"].forEach(v => {
    $(`#view-${v}`).classList.toggle("active", v === name);
    $(`#tab-${v}`).classList.toggle("active", v === name);
  });
  if (name === "table") loadTable();
}

function panelCell(title, tag, videoUrl, stats, note, scriptId, metrics) {
  return `
    <div class="cell">
      <h3><span>${title}</span><span class="tag">${tag || ""}</span></h3>
      ${videoUrl
        ? `<video controls preload="metadata" loop src="${videoUrl}"></video>`
        : `<div class="missing">${note || "not generated yet"}</div>`}
      <div class="stats">${stats || ""}</div>
      ${scriptId ? `<button class="toggle" onclick="toggleScript('${scriptId}')"
                      id="btn-${scriptId}">&#9662; narration</button>
                    <div class="script" id="${scriptId}">loading…</div>` : ""}
      ${metrics !== undefined ? metricsBlock(metrics) : ""}
    </div>`;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* Render a narration script from a sequence in the *bench* dialect, which is
   what both our output and the reference use once converted -- one entry per
   timestamp, with the elements it animates. */
function renderScript(el, seq, err) {
  if (err) { el.innerHTML = `<div class="sub">${esc(err)}</div>`; return; }
  const steps = (seq && seq.sequence) || [];
  if (!steps.length) { el.innerHTML = `<div class="sub">no narration</div>`; return; }
  el.innerHTML = steps.map(s => {
    const ta = s.to_be_animated || {};
    const ids = ["blocks", "nodes", "text", "arrows"]
      .flatMap(b => (ta[b] || []).map(e => e.id || e))
      .filter(Boolean);
    const txt = s.narrative
      ? `<div class="txt">${esc(s.narrative)}</div>`
      : `<div class="txt silent">(no narration for this step)</div>`;
    return `<div class="step"><div class="t">${s.timestamp}</div>
      <div style="flex:1;min-width:0">${txt}
        <div class="ids">${esc(ids.join(", "))}</div></div></div>`;
  }).join("");
}

/* Colour a value by whether it is good, using each metric's own direction --
   "lower is better" metrics (violations, integration footprint) must not be
   painted red for being small. */
function metricClass(m) {
  const v = m.value;
  if (typeof v === "boolean") return v ? "good" : "bad";
  if (typeof v !== "number") return "";
  if (m.better === "lower") {
    // Unbounded metrics (AIF) have no natural 0-1 scale.
    if (m.key === "aif") return v <= 0.1 ? "good" : (v <= 0.5 ? "mid" : "bad");
    return v <= 0.05 ? "good" : (v <= 0.25 ? "mid" : "bad");
  }
  return v >= 0.8 ? "good" : (v >= 0.5 ? "mid" : "bad");
}

function fmtMetric(v) {
  if (typeof v === "boolean") return v ? "pass" : "FAIL";
  if (typeof v === "number") return Number.isInteger(v) ? v.toFixed(2) : v.toFixed(3);
  return String(v ?? "—");
}

const SUITE_TITLE = {
  stage1: "Stage 1 · diagram code",
  xml: "Stage 2 · structure XML",
  sequence: "Stage 2 · animation sequence",
  stage3: "Stage 3 · animation code",
};

function metricsBlock(metrics) {
  if (!metrics || !metrics.available)
    return `<div class="metrics"><div class="sub" style="margin:0">
              no metrics yet &mdash; run <code>animatebench.run_eval</code></div></div>`;

  return `<div class="metrics">${metrics.suites.map(s => `
    <div class="msuite">
      <div class="h">${esc(SUITE_TITLE[s.suite] || s.suite)}</div>
      ${s.error ? `<div class="caveat">${esc(s.error)}</div>` : ""}
      ${s.metrics.map(m => `
        <div class="mrow">
          <div class="metric">
            <span class="q" title="${esc(m.what)}${m.caveat ? "\n\n" + esc(m.caveat) : ""}">?</span>
            <span class="name">${esc(m.label)}
              <span class="pill" style="margin-left:4px">${esc(m.doc || "")}</span></span>
            <span class="val ${metricClass(m)}">${fmtMetric(m.value)}</span>
          </div>
          <div class="why">${esc(m.what)}
            <span style="opacity:.7">(${esc(m.better)} is better${
              m.range ? ", " + esc(m.range) : ""})</span></div>
          ${m.caveat ? `<div class="caveat">${esc(m.caveat)}</div>` : ""}
        </div>`).join("")}
    </div>`).join("")}</div>`;
}

function toggleScript(id) {
  const el = document.getElementById(id), btn = document.getElementById("btn-" + id);
  const hidden = el.classList.toggle("collapsed");
  if (btn) btn.innerHTML = (hidden ? "&#9656;" : "&#9662;") + " narration";
}

function seqPills(seq) {
  if (!seq) return `<span class="pill bad">no sequence</span>`;
  if (seq.error) return `<span class="pill bad">${seq.error}</span>`;
  return [
    `<span class="pill">${seq.steps} steps</span>`,
    `<span class="pill">${seq.elements} elements</span>`,
    seq.narrated
      ? `<span class="pill ok">${seq.narrated} narrated</span>`
      : `<span class="pill warn">no narration</span>`,
    seq.traversal_style ? `<span class="pill">${seq.traversal_style}</span>` : "",
    seq.bench_schema ? `<span class="pill ok">bench schema</span>` : "",
  ].join("");
}

async function loadTable() {
  const model = $("#tbl-model").value, style = $("#style").value;
  if (!model || !style) return;
  $("#tbl-status").textContent = "loading…";
  const d = await (await fetch(`/api/table/${encodeURIComponent(model)}/${style}`)).json();

  const groups = d.groups;
  const grpRow = ['<th rowspan="2">sample</th>'].concat(
    groups.map(g => `<th colspan="${g.columns.length || 1}">${esc(g.label)}</th>`)).join("");
  const colRow = groups.flatMap(g =>
    g.columns.length
      ? g.columns.map(c => `<th title="${esc(c.what || "")}">${esc(c.label || c.key)}</th>`)
      : [`<th>&mdash;</th>`]).join("");

  const bodyRows = d.rows.map(r => {
    const cells = groups.map(g => {
      const cell = r.cells[g.suite] || { error: null, values: {} };
      if (cell.error)
        return `<td class="err" colspan="${g.columns.length || 1}">${esc(cell.error)}</td>`;
      if (!g.columns.length) return `<td>&mdash;</td>`;
      return g.columns.map(c => {
        const v = cell.values[c.key];
        if (v === undefined) return `<td class="val">&mdash;</td>`;
        return `<td class="val ${metricClass({ key: c.key, value: v, better: c.better })}">${fmtMetric(v)}</td>`;
      }).join("");
    }).join("");
    return `<tr><td title="${esc(r.title || "")}">${esc(r.id)}</td>${cells}</tr>`;
  }).join("");

  $("#scoreboard").innerHTML =
    `<thead><tr class="grp">${grpRow}</tr><tr class="cols">${colRow}</tr></thead>
     <tbody>${bodyRows}</tbody>`;
  $("#tbl-status").textContent = `${d.rows.length} sample(s) &middot; ${model} &middot; ${style}`;
}

async function load() {
  const id = $("#sample").value, style = $("#style").value;
  if (!id || !style) return;
  $("#status").textContent = "loading…";
  const d = await (await fetch(`/api/compare/${id}/${style}`)).json();

  const cells = [];

  // 1. Ground truth: the source figure the whole pipeline starts from.
  cells.push(`
    <div class="cell">
      <h3><span>Ground truth &mdash; source figure</span><span class="tag">input</span></h3>
      <img src="${d.figure}">
      <div class="sub">${d.title || ""}</div>
    </div>`);

  // 2. The author's real conference talk, when the bundle shipped one.
  if (d.presentation) {
    const p = d.presentation;
    cells.push(`
      <div class="cell talk">
        <h3><span>Original presentation</span><span class="tag">author talk</span></h3>
        ${p.video
          ? `<video controls preload="metadata" src="${p.video}"></video>`
          : `<div class="missing">no video in bundle</div>`}
        <div class="meta">
          ${esc(p.title || "")}<br>
          ${p.uploader ? esc(p.uploader) + " &middot; " : ""}${p.duration ? Math.round(p.duration / 60) + " min" : ""}
          ${p.url ? ` &middot; <a href="${p.url}" target="_blank" rel="noopener">source</a>` : ""}
        </div>
        ${p.transcript ? `<div class="transcript">${esc(p.transcript)}</div>` : ""}
      </div>`);
  }

  // 3. The benchmark's own animation for this style.
  const revs = (d.reference.reviews || [])
    .filter(r => (r.questionnaire || []).length)
    .map(r => `v${r.version}: ${r.questionnaire.join(", ")}`).join(" · ");
  cells.push(panelCell(
    "Reference (AnimateBench)", "tikz · full context",
    d.reference.video,
    revs ? `<span class="pill warn">human review: ${revs}</span>` : "",
    d.reference.available_keys.length
      ? "no tikz/full-context video for this style"
      : "no reference videos imported",
    "script-ref"));

  // 3-5. One per model.
  d.panels.forEach((p, i) => {
    cells.push(panelCell(
      p.label, p.model, p.video,
      seqPills(p.sequence) +
        (p.frames ? `<span class="pill">${p.frames} frames</span>` : "") +
        (!p.video && p.code ? `<span class="pill warn">code, no render</span>` : ""),
      p.code ? "animation code exists but did not render" : "not generated yet",
      `script-${i}`, p.metrics));
  });

  $("#grid").innerHTML = cells.join("");
  const done = d.panels.filter(p => p.video).length;
  $("#status").textContent = `${done}/${d.panels.length} model outputs ready`;

  // Narration is fetched per panel after the grid renders, so a slow or
  // missing script never delays the videos appearing.
  loadScript("script-ref", `/api/reference-sequence/${id}/${style}`, j => j);
  d.panels.forEach((p, i) => {
    if (!p.sequence) {
      renderScript(document.getElementById(`script-${i}`), null, "no sequence generated");
      return;
    }
    loadScript(`script-${i}`,
      `/api/sequence/${encodeURIComponent(p.label)}/${id}/${style}`, j => j.bench);
  });
}

async function loadScript(elId, url, pick) {
  const el = document.getElementById(elId);
  if (!el) return;
  try {
    const r = await fetch(url);
    if (!r.ok) { renderScript(el, null, `not available (HTTP ${r.status})`); return; }
    const j = await r.json();
    if (j.error) { renderScript(el, null, j.error); return; }
    renderScript(el, pick(j));
  } catch (e) {
    renderScript(el, null, String(e));
  }
}

const vids = () => Array.from(document.querySelectorAll("video"));
function playAll()    { vids().forEach(v => v.play().catch(() => {})); }
function pauseAll()   { vids().forEach(v => v.pause()); }
function restartAll() { vids().forEach(v => { v.currentTime = 0; v.play().catch(() => {}); }); }

document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.code === "Space") { e.preventDefault();
    vids().some(v => !v.paused) ? pauseAll() : playAll(); }
  if (e.key === "r") restartAll();
});

boot();
</script>
