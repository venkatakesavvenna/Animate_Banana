<style>
  /* Judge rationales are prose. Without this the evidence tables inherit the
     nowrap used for id-like values and a six-criterion rationale becomes one
     unreadable horizontal scroll. */
  .xev table { table-layout: fixed; width: 100%; }
  .xev td, .xev th { white-space: normal; word-break: break-word;
                     vertical-align: top; font-size: 12px; line-height: 1.45; }
  .xev pre { white-space: pre-wrap; word-break: break-word; }

  /* All-models overview. Inherits table.score, so only the differences live
     here: a sticky header (the table runs long), left-aligned identity columns,
     and the per-metric sort controls. */
  table.score.ov thead th { position: sticky; top: 0; z-index: 2;
    background: var(--panel2); }
  table.score.ov thead th:first-child { z-index: 3; }
  table.score.ov th.mcol { text-align: right; white-space: nowrap; }
  table.score.ov td.mdl { text-align: left; font-weight: 600; }
  table.score.ov td.smp { text-align: left; color: var(--dim);
    font-family: ui-monospace, monospace; font-size: 11px; }
  table.score.ov td.sty { text-align: left; color: var(--dim); font-size: 11px; }

  .sortbtns { display: inline-flex; gap: 1px; margin-left: 5px;
              vertical-align: middle; }
  .sortb { font: 8px/1 ui-monospace, monospace; padding: 2px 3px; cursor: pointer;
           border: 1px solid var(--line); background: var(--panel);
           color: var(--dim); border-radius: 2px; }
  .sortb:hover { color: var(--fg); border-color: var(--dim); }
  .sortb.on { color: var(--bg); background: var(--accent);
              border-color: var(--accent); font-weight: 700; }
</style>
<title>AnimateBench — side by side</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --panel2: #23272f; --line: #2f343d;
    --fg: #e6e8ec; --dim: #949aa6; --accent: #6ea8fe; --ok: #4ec9a0;
    --warn: #e0af68; --bad: #f07178;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }

  header { padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
           position: sticky; top: 0; z-index: 10; }
  h1 { margin: 0 0 10px; font-size: 15px; font-weight: 600; letter-spacing: .2px; }
  .controls { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  label { color: var(--dim); font-size: 11px; text-transform: uppercase;
          letter-spacing: .6px; margin-right: 6px; }
  select, button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
                   border-radius: 4px; padding: 6px 10px; font-size: 12.5px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #10131a; border-color: var(--accent);
                   font-weight: 600; }

  main { padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 16px; margin-bottom: 20px; }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }

  .cell { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
          padding: 12px; min-width: 0; }
  .cell h3 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase;
             letter-spacing: .7px; color: var(--dim); font-weight: 600;
             display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .cell h3 .tag { text-transform: none; letter-spacing: 0; color: var(--accent);
                  font-family: ui-monospace, monospace; font-size: 11px; }
  video, .cell img { width: 100%; border-radius: 4px; background: #fff; display: block; }
  .missing { padding: 40px 12px; text-align: center; color: var(--dim);
             background: var(--panel2); border-radius: 4px; font-size: 12px; }
  .stats { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 10.5px;
          background: var(--panel2); border: 1px solid var(--line); color: var(--dim); }
  .pill.ok { color: var(--ok); border-color: #2c5c4c; }
  .pill.bad { color: var(--bad); border-color: #5c2f36; }
  .pill.warn { color: var(--warn); border-color: #5c4a2c; }
  .sub { color: var(--dim); font-size: 11px; margin-top: 6px; word-break: break-all; }
  .reviews { margin-top: 8px; font-size: 11px; color: var(--warn); }

  /* narration script, per panel */
  .script { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px;
            max-height: 260px; overflow-y: auto; }
  .script.collapsed { max-height: 0; padding-top: 0; border-top: none; overflow: hidden; }
  .step { display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px solid #23272f; }
  .step:last-child { border-bottom: none; }
  .step .t { flex: 0 0 22px; color: var(--accent); font-family: ui-monospace, monospace;
             font-size: 10.5px; padding-top: 1px; }
  .step .txt { flex: 1; font-size: 12px; line-height: 1.45; }
  .step .txt.silent { color: var(--dim); font-style: italic; }
  .step .ids { color: var(--dim); font-size: 10px; font-family: ui-monospace, monospace;
               margin-top: 2px; word-break: break-all; }
  .toggle { background: none; border: none; color: var(--accent); cursor: pointer;
            font-size: 11px; padding: 4px 0; text-align: left; }

  /* metrics block */
  .metrics { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  .msuite { margin-bottom: 10px; }
  .msuite > .h { color: var(--dim); font-size: 10px; text-transform: uppercase;
                 letter-spacing: .7px; margin-bottom: 4px; }
  .metric { display: flex; align-items: baseline; gap: 8px; padding: 3px 0;

  .metric:last-child { border-bottom: none; }
  .metric .name { flex: 1; font-size: 12px; }
  .metric .val { font-family: ui-monospace, monospace; font-size: 13px;
                 font-weight: 600; min-width: 52px; text-align: right; }
  .metric .val.good { color: var(--ok); }
  .metric .val.mid  { color: var(--warn); }
  .metric .val.bad  { color: var(--bad); }
  .metric .why { color: var(--dim); font-size: 11px; line-height: 1.4;
                 margin: 0 0 4px 0; }
  .metric .q { color: var(--dim); cursor: help; font-size: 10px;
               border: 1px solid var(--line); border-radius: 50%;
               width: 14px; height: 14px; display: inline-flex;
               align-items: center; justify-content: center; flex: 0 0 14px; }
  .metric .q:hover { color: var(--accent); border-color: var(--accent); }
  .mrow { border-bottom: 1px solid #23272f; padding: 5px 0; }
  .mrow:last-child { border-bottom: none; }
  .caveat { color: var(--warn); font-size: 10.5px; margin-top: 2px; }

  /* tabs */
  .tabs { display: flex; gap: 4px; margin-left: auto; }
  .tab { background: none; border: 1px solid var(--line); border-radius: 4px 4px 0 0;
         color: var(--dim); padding: 6px 14px; cursor: pointer; font-size: 12.5px; }
  .tab.active { background: var(--bg); color: var(--fg); border-bottom-color: var(--bg);
                position: relative; top: 1px; }
  .view { display: none; }
  .view.active { display: block; }

  /* scoreboard table */
  .tblwrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line);
             border-radius: 6px; }
  table.score { border-collapse: collapse; width: 100%; font-size: 12px; white-space: nowrap; }
  table.score th, table.score td { padding: 5px 9px; border-bottom: 1px solid var(--line);
                                    border-right: 1px solid #23272f; text-align: right; }
  table.score th:first-child, table.score td:first-child { text-align: left;
    position: sticky; left: 0; background: var(--panel); z-index: 1; }
  table.score thead tr.grp th { text-align: center; color: var(--accent);

  table.score td.val.good { color: var(--ok); }
  table.score td.val.mid  { color: var(--warn); }
  table.score td.val.bad  { color: var(--bad); }

  /* metrics explorer */
  .xnote { background: var(--panel); border: 1px solid var(--line);

  .xeg { border-left-color: var(--warn); margin-top: 10px; }
  .xeg .h { color: var(--warn); font-weight: 600; font-size: 11px;
            text-transform: uppercase; letter-spacing: .6px; margin-bottom: 5px; }

  .xsuite { background: var(--panel); border: 1px solid var(--line);
            border-radius: 6px; padding: 14px 16px; margin-bottom: 16px; }
  .xsuite > h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .3px;
                 color: var(--fg); font-weight: 600; }

  .xmetric { border-top: 1px solid var(--line); padding: 11px 0 9px; }
  .xmetric:first-of-type { border-top: none; }
  .xhead { display: flex; align-items: baseline; gap: 10px; }
  .xhead .nm { font-size: 13px; font-weight: 600; flex: 1; }
  .xhead .key { font-family: ui-monospace, monospace; font-size: 10.5px;
                color: var(--dim); }
  .xhead .v { font-family: ui-monospace, monospace; font-size: 16px;
              font-weight: 700; }
  .xhead .v.good { color: var(--ok); }
  .xhead .v.mid  { color: var(--warn); }
  .xhead .v.bad  { color: var(--bad); }
  .xformula { font-family: ui-monospace, monospace; font-size: 11.5px;
              background: var(--panel2); border: 1px solid var(--line);
              border-radius: 4px; padding: 7px 10px; margin: 7px 0 0;
              color: var(--fg); white-space: pre-wrap; overflow-x: auto; }
  .xinst { color: var(--accent); font-weight: 600; }
  .xwhat { color: var(--dim); font-size: 12px; margin-top: 6px;
           line-height: 1.5; max-width: 78ch; }
  .xev { margin-top: 7px; background: var(--panel2); border-radius: 4px;
         padding: 9px 11px; max-height: 300px; overflow: auto; }
  .xev.collapsed { display: none; }
  .xev table { border-collapse: collapse; width: 100%; font-size: 11px; }
  .xev td, .xev th { padding: 2px 8px 2px 0; text-align: left;
                     vertical-align: top; }
  .xev th { color: var(--dim); font-weight: 500; }
  .xev .k { color: var(--dim); font-family: ui-monospace, monospace;
            font-size: 10.5px; }
  .xev pre { margin: 2px 0 8px; font-size: 10.5px; color: var(--fg);
             white-space: pre-wrap; word-break: break-word; }

  /* alignment table */
  .xalign td, .xalign th { border-bottom: 1px solid #23272f; padding: 4px 10px 4px 0; }
  .xalign .ids { font-family: ui-monospace, monospace; font-size: 10.5px; }
  .xalign .gt  { color: var(--accent); }
  .xalign .pr  { color: var(--ok); }
  .xrow { display: grid; grid-template-columns: repeat(4, minmax(0,1fr));
          gap: 14px; margin-bottom: 18px; }
  @media (max-width: 1250px) { .xrow { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 700px)  { .xrow { grid-template-columns: 1fr; } }

  /* Metrics sub-tabs: one per target, identical layout underneath. */
  .xtargets { display: flex; align-items: center; gap: 6px; margin-bottom: 14px;
              padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .xtab { background: var(--panel2); color: var(--dim); border: 1px solid var(--line);
          border-radius: 4px; padding: 5px 16px; cursor: pointer; font-size: 12.5px;
          font-family: inherit; text-transform: uppercase; letter-spacing: .6px; }
  .xtab:hover { border-color: var(--accent); }
  .xtab.active { background: var(--accent); color: #10131a; border-color: var(--accent);
                 font-weight: 600; }
  .xtargets .hintline { color: var(--dim); font-size: 11px; margin-left: 6px; }
  /* The inactive target's figure, kept as a quiet annotation so switching
     tabs is a comparison rather than a memory test. */
  .xhead .othertgt { font-family: ui-monospace, monospace; font-size: 10.5px;
                     color: var(--dim); margin-right: 10px; white-space: nowrap; }

  /* A SECOND JUDGE's number for the same metric on the same cell -- not the
     other target's. Deliberately styled apart from .othertgt: those two
     annotations answer different questions ("what does SVG score?" vs "what
     does the other judge score?") and reading one as the other would be a
     silent misattribution. */
  .xhead .judge2 { font-family: ui-monospace, monospace; font-size: 10.5px;
                   color: var(--dim); margin-right: 10px; white-space: nowrap;
                   border-left: 2px solid var(--line); padding-left: 7px; }
  .xhead .judge2 b { color: var(--fg); font-weight: 600; }

  /* Second judge inside a scoreboard cell: subordinate to the primary figure,
     on its own line so a scanning eye reads one column of primaries. */
  td.val .j2 { display: block; font-size: 10px; color: var(--dim);
               margin-top: 1px; }

  /* Panels: a model's targets forced onto one row, side by side. */
  .pairrow { grid-column: 1 / -1; display: grid; gap: 16px; }

  /* Scoreboard: the second target of a sample reads as a continuation. */
  table.score td.tgtcell { font-family: ui-monospace, monospace; font-size: 10.5px;

  table.score tr.contd td:first-child { border-bottom-color: transparent; }
  table.score tr.contd td { border-top: none; }

  /* frame slideshow (metrics tab only) -- the video plays at 2fps and
     cannot be stepped; judging a per-frame metric means looking at the

  .xslides { background: var(--panel); border: 1px solid var(--line);

  .xslides h3 .tag { font-size: 10px; color: var(--dim); font-weight: 500; }

  .xslides .stage img { max-width: 100%; max-height: 62vh; display: block; }
  .xslides .ctl { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .xslides .ctl button { background: var(--panel2); color: var(--fg);

  .xslides .ctl button:hover { border-color: var(--accent); }
  .xslides .ctl input[type=range] { flex: 1; accent-color: var(--accent); }
  .xslides .ctl .pos { font-family: ui-monospace, monospace; font-size: 11.5px;

  .xslides .hint { font-size: 11px; color: var(--dim); margin-top: 7px; }

  /* presentation panel */
  .talk .meta { font-size: 11px; color: var(--dim); margin-top: 6px; }
  .talk .meta a { color: var(--accent); }
  .talk .transcript { margin-top: 8px; max-height: 160px; overflow-y: auto;
    font-size: 11.5px; color: var(--dim); border-top: 1px solid var(--line); padding-top: 6px; }
</style>

<header>
  <h1>AnimateBench &mdash; reference vs pipeline</h1>
  <div class="controls">
    <span><label>Sample</label><select id="sample" onchange="onSampleOrStyleChange()"></select></span>
    <span><label>Style</label><select id="style" onchange="onSampleOrStyleChange()"></select></span>
    <button class="primary" onclick="playAll()">&#9654; play all</button>
    <button onclick="pauseAll()">&#10073;&#10073; pause</button>
    <button onclick="restartAll()">&#8635; restart</button>
    <span id="status" class="sub" style="margin:0"></span>
    <div class="tabs">
      <button class="tab active" id="tab-panels" onclick="showView('panels')">Panels</button>
      <button class="tab" id="tab-table" onclick="showView('table')">Scoreboard</button>
      <button class="tab" id="tab-overview" onclick="showView('overview')">All models</button>
      <button class="tab" id="tab-explain" onclick="showView('explain')">Metrics</button>
    </div>
    <!-- Framewise export: every per-timestep band behind the cell means, as
         long-format CSV -- the means live in the tables above, but choosing
         an aggregation needs the distribution, not its summary. -->
    <a href="/steps.csv" download style="margin-left:8px">&#8681; steps.csv</a>
  </div>
</header>

<main>
  <div id="view-panels" class="view active"><div id="grid" class="grid"></div></div>
  <div id="view-table" class="view">
    <div class="controls" style="margin-bottom:12px">
      <span><label>Model</label><select id="tbl-model" onchange="loadTable()"></select></span>
      <span id="tbl-status" class="sub" style="margin:0"></span>
      <label id="j2-wrap" class="sub" style="margin:0; display:none;
             align-items:center; gap:5px; cursor:pointer;">
        <input type="checkbox" id="j2-toggle"
               onchange="toggleJudge2(this.checked)"> <span id="j2-label"></span>
      </label>
    </div>
    <div class="tblwrap"><table class="score" id="scoreboard"></table></div>
  </div>
  <div id="view-overview" class="view">
    <div id="ov-status" class="sub"></div>
    <div class="tblwrap"><table class="score ov" id="ov-table"></table></div>
  </div>

<div id="view-explain" class="view">
    <div class="controls" style="margin-bottom:14px">
      <span><label>Model</label><select id="xp-model" onchange="loadExplain()"></select></span>
      <span id="xp-status" class="sub" style="margin:0"></span>
    </div>
    <div id="xp-body"></div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
let INDEX = null;
// sample id -> its one style, in a study view. Empty for a full-bench view.
let CELL_STYLE = null;

async function boot() {
  INDEX = await (await fetch("/api/index")).json();
  $("#sample").innerHTML = INDEX.samples
    .map(s => `<option value="${s.id}">${s.id}${s.has_reference ? "" : " (no reference)"}</option>`)
    .join("");
  $("#style").innerHTML = INDEX.styles.map(s => `<option value="${s}">${s}</option>`).join("");
  // STUDY VIEW: each sample was generated for exactly one style, so the style
  // selector follows the sample instead of being a free choice. Leaving it free
  // lets a reader select a (sample, style) cell nobody ever ran and read the
  // empty panels as a pipeline failure rather than as "not part of this study".
  if (INDEX.cells) {
    CELL_STYLE = Object.fromEntries(INDEX.cells.map(c => [c.id, c.style]));
    pinStyle();
    // The style follows the sample, so the control has exactly one option and
    // changing it is impossible. Hidden rather than disabled: a greyed-out
    // dropdown still reads as "there are other styles here", and there are not.
    const sel = $("#style");
    if (sel && sel.parentElement) sel.parentElement.style.display = "none";
  }
  const modelOpts = INDEX.models
    .map(m => `<option value="${esc(m.label)}">${esc(m.label)}</option>`).join("");
  $("#tbl-model").innerHTML = modelOpts;
  $("#xp-model").innerHTML = modelOpts;
  load();
}

// Narrow the style selector to the current sample's own style. The option is
// still rendered (rather than the control being hidden) so the reader can see
// WHICH style this cell is, which is part of what the comparison is about.
function pinStyle() {
  if (!CELL_STYLE) return;
  const style = CELL_STYLE[$("#sample").value];
  if (!style) return;
  $("#style").innerHTML = `<option value="${style}">${style}</option>`;
  $("#style").value = style;
}

function onSampleOrStyleChange() {
  pinStyle();
  load();
  if ($("#view-table").classList.contains("active")) loadTable();
  if ($("#view-explain").classList.contains("active")) loadExplain();
  if ($("#view-overview") && $("#view-overview").classList.contains("active")) loadOverview();
}

function showView(name) {
  ["panels", "table", "explain", "overview"].forEach(v => {
    $(`#view-${v}`).classList.toggle("active", v === name);
    $(`#tab-${v}`).classList.toggle("active", v === name);
  });
  // The slideshow lives only in the Metrics tab; leaving it running while
  // hidden would keep pulling full-resolution frames for a view nobody is
  // looking at.
  if (name !== "explain") stopSlides();
  if (name === "table") loadTable();
  if (name === "explain") loadExplain();
  if (name === "overview") loadOverview();
}

function panelCell(title, tag, videoUrl, stats, note, scriptId, metrics) {
  return `
    <div class="cell">
      <h3><span>${title}</span><span class="tag">${tag || ""}</span></h3>
      ${videoUrl
        ? `<video controls preload="metadata" loop src="${videoUrl}"></video>`
        : `<div class="missing">${note || "not generated yet"}</div>`}
      <div class="stats">${stats || ""}</div>
      ${scriptId ? `<button class="toggle" onclick="toggleScript('${scriptId}')"
                      id="btn-${scriptId}">&#9662; narration</button>
                    <div class="script" id="${scriptId}">loading…</div>` : ""}
      ${metrics !== undefined ? metricsBlock(metrics) : ""}
    </div>`;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* Render a narration script from a sequence in the *bench* dialect, which is
   what both our output and the reference use once converted -- one entry per
   timestamp, with the elements it animates. */
function renderScript(el, seq, err) {
  if (err) { el.innerHTML = `<div class="sub">${esc(err)}</div>`; return; }
  const steps = (seq && seq.sequence) || [];
  if (!steps.length) { el.innerHTML = `<div class="sub">no narration</div>`; return; }
  el.innerHTML = steps.map(s => {
    const ta = s.to_be_animated || {};
    const ids = ["blocks", "nodes", "text", "arrows"]
      .flatMap(b => (ta[b] || []).map(e => e.id || e))
      .filter(Boolean);
    const txt = s.narrative
      ? `<div class="txt">${esc(s.narrative)}</div>`
      : `<div class="txt silent">(no narration for this step)</div>`;
    return `<div class="step"><div class="t">${s.timestamp}</div>
      <div style="flex:1;min-width:0">${txt}
        <div class="ids">${esc(ids.join(", "))}</div></div></div>`;
  }).join("");
}

/* Colour a value by whether it is good, using each metric's own direction --
   "lower is better" metrics (violations, integration footprint) must not be
   painted red for being small. */
function metricClass(m) {
  const v = m.value;
  if (typeof v === "boolean") return v ? "good" : "bad";
  if (typeof v !== "number") return "";
  if (m.better === "lower") {
    // Unbounded metrics (AIF) have no natural 0-1 scale.
    if (m.key === "aif") return v <= 0.1 ? "good" : (v <= 0.5 ? "mid" : "bad");
    return v <= 0.05 ? "good" : (v <= 0.25 ? "mid" : "bad");
  }
  // The video judge uses the 0-1 range far more conservatively than the frame
  // judge: over 64 scored cells it never went above 0.73, while the frame
  // judge returned exactly 1.0 on 55 of them. Sharing the 0.8/0.5 cutoffs
  // would paint every video score amber and read as "everything is mediocre",
  // which is a statement about the two judges' calibration, not the
  // animations. Banded against its own observed distribution instead.
  if (m.key === "vfs_video") return v >= 0.68 ? "good" : (v >= 0.55 ? "mid" : "bad");
  return v >= 0.8 ? "good" : (v >= 0.5 ? "mid" : "bad");
}

function fmtMetric(v) {
  if (typeof v === "boolean") return v ? "pass" : "FAIL";
  if (typeof v === "number") return Number.isInteger(v) ? v.toFixed(2) : v.toFixed(3);
  return String(v ?? "—");
}

const SUITE_TITLE = {
  stage1: "Stage 1 · diagram code",
  xml: "Stage 2 · structure XML",
  sequence: "Stage 2 · animation sequence",
  stage3: "Stage 3 · animation code",
};

function metricsBlock(metrics) {
  if (!metrics || !metrics.available)
    return `<div class="metrics"><div class="sub" style="margin:0">
              no metrics yet &mdash; run <code>animatebench.run_eval</code></div></div>`;

  return `<div class="metrics">${metrics.suites.map(s => `
    <div class="msuite">
      <div class="h">${esc(SUITE_TITLE[s.suite] || s.suite)}</div>
      ${s.error ? `<div class="caveat">${esc(s.error)}</div>` : ""}
      ${s.metrics.map(m => `
        <div class="mrow">
          <div class="metric">
            <span class="q" title="${esc(m.what)}${m.caveat ? "\n\n" + esc(m.caveat) : ""}">?</span>
            <span class="name">${esc(m.label)}
              <span class="pill" style="margin-left:4px">${esc(m.doc || "")}</span></span>
            <span class="val ${metricClass(m)}">${fmtMetric(m.value)}</span>
          </div>
          <div class="why">${esc(m.what)}
            <span style="opacity:.7">(${esc(m.better)} is better${
              m.range ? ", " + esc(m.range) : ""})</span></div>
          ${m.caveat ? `<div class="caveat">${esc(m.caveat)}</div>` : ""}
        </div>`).join("")}
    </div>`).join("")}</div>`;
}

function toggleScript(id) {
  const el = document.getElementById(id), btn = document.getElementById("btn-" + id);
  const hidden = el.classList.toggle("collapsed");
  if (btn) btn.innerHTML = (hidden ? "&#9656;" : "&#9662;") + " narration";
}

function seqPills(seq) {
  if (!seq) return `<span class="pill bad">no sequence</span>`;
  if (seq.error) return `<span class="pill bad">${seq.error}</span>`;
  return [
    `<span class="pill">${seq.steps} steps</span>`,
    `<span class="pill">${seq.elements} elements</span>`,
    seq.narrated
      ? `<span class="pill ok">${seq.narrated} narrated</span>`
      : `<span class="pill warn">no narration</span>`,
    seq.traversal_style ? `<span class="pill">${seq.traversal_style}</span>` : "",
    seq.bench_schema ? `<span class="pill ok">bench schema</span>` : "",
  ].join("");
}

/* Whether the scoreboard also prints the second judge's number. Off by
   default: the table is read as one model's scoreboard, and two figures per
   cell by default would change what it means without being asked for. */
let SHOW_JUDGE2 = false;
function toggleJudge2(on) { SHOW_JUDGE2 = on; loadTable(); }

async function loadTable() {
  const model = $("#tbl-model").value, style = $("#style").value;
  if (!model || !style) return;
  $("#tbl-status").textContent = "loading…";
  const d = await (await fetch(`/api/table/${encodeURIComponent(model)}/${style}`)).json();

  const groups = d.groups;
  const multi = (d.targets || []).length > 1;
  // In unified mode every row can be a different style, so the style becomes a
  // column. Outside it, the table already IS one style and a column repeating
  // it on every row would be noise.
  const uni = !!d.unified;
  // A target column only when there is more than one, so a single-target
  // bench keeps the table it had.
  const grpRow = ['<th rowspan="2">sample</th>']
    .concat(uni ? ['<th rowspan="2">style</th>'] : [])
    .concat(multi ? ['<th rowspan="2">target</th>'] : [])
    .concat(groups.map(g => `<th colspan="${g.columns.length || 1}">${esc(g.label)}</th>`)).join("");
  const colRow = groups.flatMap(g =>
    g.columns.length
      ? g.columns.map(c => `<th title="${esc(c.what || "")}">${esc(c.label || c.key)}</th>`)
      : [`<th>&mdash;</th>`]).join("");

  const bodyRows = d.rows.map(r => {
    const cells = groups.map(g => {
      const cell = r.cells[g.suite] || { error: null, values: {} };
      if (cell.error)
        return `<td class="err" colspan="${g.columns.length || 1}">${esc(cell.error)}</td>`;
      if (!g.columns.length) return `<td>&mdash;</td>`;
      return g.columns.map(c => {
        const v = cell.values[c.key];
        if (v === undefined) return `<td class="val">&mdash;</td>`;
        // The second judge's figure for the same metric, shown only when the
        // toggle is on. Kept visually subordinate: this table is one model's
        // scoreboard, and an unlabelled second number in it would read as the
        // primary's.
        const sv = (cell.second || {})[c.key];
        const j2 = (SHOW_JUDGE2 && sv !== undefined && sv !== null)
          ? `<span class="j2">${esc(fmtMetric(sv))}</span>` : "";
        return `<td class="val ${metricClass({ key: c.key, value: v, better: c.better })}">${fmtMetric(v)}${j2}</td>`;
      }).join("");
    }).join("");
    // Blank the id on the second target so the pair reads as one sample.
    const idCell = `<td title="${esc(r.title || "")}">${
      r.first_of_sample === false ? "" : esc(r.id)}</td>`;
    const styCell = uni ? `<td class="tgtcell">${esc(r.style || "")}</td>` : "";
    const tgtCell = multi ? `<td class="tgtcell">${esc(r.target || "")}</td>` : "";
    const cls = r.first_of_sample === false ? ' class="contd"' : "";
    return `<tr${cls}>${idCell}${styCell}${tgtCell}${cells}</tr>`;
  }).join("");

  $("#scoreboard").innerHTML =
    `<thead><tr class="grp">${grpRow}</tr><tr class="cols">${colRow}</tr></thead>
     <tbody>${bodyRows}</tbody>`;
  // `textContent`, so an HTML entity would be shown literally -- and rows are
  // no longer samples now that each sample contributes one row per target.
  // Only offer the toggle when a second judge really scored these cells --
  // a dead checkbox is worse than no checkbox.
  const j2name = (() => {
    for (const r of d.rows) for (const k in (r.cells || {}))
      if (r.cells[k] && r.cells[k].second_judge) return r.cells[k].second_judge;
    return null;
  })();
  const wrap = $("#j2-wrap");
  if (wrap) {
    wrap.style.display = j2name ? "inline-flex" : "none";
    const lab = $("#j2-label");
    if (lab && j2name) lab.textContent = "also show " + j2name.split("/").pop();
  }
  const nSamples = new Set(d.rows.map(r => r.id)).size;
  $("#tbl-status").textContent =
    `${nSamples} sample(s)` + (multi ? ` × ${d.targets.length} targets` : "") +
    ` · ${model} · ${style}`;
}

/* ---- Metrics explorer -------------------------------------------------
   Every number is shown beside the formula that produced it, instantiated on
   this sample's own terms, and beside the evidence the metric stored. The
   point is to be able to disagree with a score: if the formula and the
   evidence do not justify the number, the metric is wrong, not the sample. */

/* ALL-MODELS OVERVIEW.
   One row per (model, cell) for every metric at once, so a sort ranks across
   the whole study rather than within one model's table.

   Ordering NEVER uses the displayed value. It uses the server's normalised
   `sort` key, which is always higher-is-better -- `vfs_band` stores 0=BAND A
   (best) while descriptions.py declares better="higher", so sorting the raw
   value would put BAND D on top and look perfectly plausible. */
let OV = null, OV_SORT = {key: null, dir: -1};

async function loadOverview() {
  $("#ov-status").textContent = "loading…";
  OV = await (await fetch("/api/overview")).json();
  renderOverview();
}

function ovSort(key, dir) {
  OV_SORT = {key, dir};
  renderOverview();
}

function renderOverview() {
  if (!OV) return;
  const cols = OV.columns;
  const rows = OV.rows.slice();
  const k = OV_SORT.key;
  if (k) {
    rows.sort((a, b) => {
      const av = a.sort[k], bv = b.sort[k];
      // Unrankable rows always sink, whichever direction is chosen -- they must
      // never occupy the "best" end of the table by accident.
      if (av === undefined && bv === undefined) return 0;
      if (av === undefined) return 1;
      if (bv === undefined) return -1;
      return OV_SORT.dir * (av - bv);
    });
  }
  const head = ['<th>model</th>', '<th>sample</th>', '<th>style</th>']
    .concat(cols.map(c => {
      const on = k === c.key;
      const lbl = esc(c.label || c.key);
      return `<th class="mcol" title="${esc(c.what || "")}">${lbl}
        <span class="sortbtns">
          <button class="sortb ${on && OV_SORT.dir === -1 ? "on" : ""}"
                  title="best first" onclick="ovSort('${c.key}',-1)">&#9650;</button>
          <button class="sortb ${on && OV_SORT.dir === 1 ? "on" : ""}"
                  title="worst first" onclick="ovSort('${c.key}',1)">&#9660;</button>
        </span></th>`;
    })).join("");
  const body = rows.map(r => {
    const cells = cols.map(c => {
      const v = r.values[c.key];
      if (v === undefined) return '<td class="val">&mdash;</td>';
      return `<td class="val ${metricClass({key: c.key, value: v, better: c.better})}"
                  title="${esc(String(v))}">${fmtMetric(v)}</td>`;
    }).join("");
    return `<tr><td class="mdl">${esc(r.model)}</td>`
         + `<td class="smp" title="${esc(r.sample)}">${esc(r.sample)}</td>`
         + `<td class="sty">${esc(r.style)}</td>${cells}</tr>`;
  }).join("");
  $("#ov-table").innerHTML =
    `<thead><tr class="cols">${head}</tr></thead><tbody>${body}</tbody>`;
  $("#ov-status").textContent =
    `${rows.length} row(s) · ${OV.models.length} model(s) · ${OV.cells} cell(s)`
    + (k ? ` · sorted by ${k} (${OV_SORT.dir === -1 ? "best first" : "worst first"})` : "");
}

function evidenceTable(ev) {
  const rows = Object.entries(ev).map(([k, v]) => {
    let body;
    if (Array.isArray(v) && v.length && typeof v[0] === "object") {
      const cols = [...new Set(v.flatMap(o => Object.keys(o)))];
      body = `<table><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr>` +
        v.map(o => `<tr>${cols.map(c =>
          `<td class="k">${esc(fmtCell(o[c]))}</td>`).join("")}</tr>`).join("") +
        `</table>`;
    } else if (typeof v === "object") {
      body = `<table>${Object.entries(v).map(([kk, vv]) =>
        `<tr><td class="k">${esc(kk)}</td><td>${esc(fmtCell(vv))}</td></tr>`
      ).join("")}</table>`;
    } else if (Array.isArray(v)) {
      body = `<pre>${esc(v.join(", "))}</pre>`;
    } else {
      body = `<pre>${esc(String(v))}</pre>`;
    }
    return `<div><div class="k">${esc(k)}</div>${body}</div>`;
  });
  return rows.join("");
}

function fmtCell(v) {
  if (v === null || v === undefined) return "—";
  if (typeof v === "object") return JSON.stringify(v);
  if (typeof v === "number" && !Number.isInteger(v)) return v.toFixed(3);
  return String(v);
}

/* The value for the target currently selected by the Metrics sub-tabs.
   One number per row, in the same place for every target, so switching
   between TikZ and SVG compares like with like instead of asking the reader
   to track two figures crammed onto one line. `delta` carries the other
   target's number as a quiet annotation rather than a competing headline. */
function targetValues(m, targets) {
  const active = XP_TARGET;
  const has = m.by_target && Object.prototype.hasOwnProperty.call(m.by_target, active);
  const v = has ? m.by_target[active] : m.value;
  const cls = (v === null || v === undefined)
    ? "" : metricClass({ key: m.key, value: v, better: m.better });
  let other = "";
  if (targets && targets.length > 1 && m.by_target) {
    const others = targets.filter(tg => tg !== active)
      .map(tg => `${tg} ${fmtMetric(m.by_target[tg])}`);
    if (others.length) other = `<span class="othertgt">${esc(others.join("  "))}</span>`;
  }
  // The second judge's number for the SAME target, when one scored this cell.
  let j2 = "";
  if (m.second_by_target) {
    const sv = m.second_by_target[active];
    if (sv !== null && sv !== undefined)
      j2 = `<span class="judge2">2nd <b>${esc(fmtMetric(sv))}</b></span>`;
  }
  return `${j2}${other}<span class="v ${cls}">${fmtMetric(v)}</span>`;
}

function explainMetric(m, uid, targets) {
  const hasEv = m.evidence && Object.keys(m.evidence).length;
  return `
    <div class="xmetric">
      <div class="xhead">
        <span class="nm">${esc(m.label || m.key)}</span>
        <span class="key">${esc(m.key)}${m.doc ? " · " + esc(m.doc) : ""}</span>
        ${targetValues(m, targets)}
      </div>
      ${m.formula ? `<div class="xformula">${esc(m.formula)}${
        m.instantiated
          ? `\n<span class="xinst">${esc(m.instantiated)}</span>` : ""}</div>` : ""}
      ${m.what ? `<div class="xwhat">${esc(m.what)}</div>` : ""}
      ${m.caveat ? `<div class="caveat">${esc(m.caveat)}</div>` : ""}
      ${hasEv ? `<button class="toggle" onclick="toggleScript('${uid}')"
                   id="btn-${uid}">&#9662; evidence</button>
                 <div class="xev collapsed" id="${uid}">${evidenceTable(m.evidence)}</div>`
              : ""}
    </div>`;
}

function alignmentBlock(a) {
  const keys = Object.keys(a.groups || {});
  if (!keys.length)
    return `<div class="xsuite"><h2>Stage-2 mapping</h2>
              <div class="sub" style="margin:0">no alignment recorded</div></div>`;
  const rows = keys.sort().map(k => {
    const g = a.groups[k];
    return `<tr>
      <td class="k">${esc(k)}</td>
      <td class="ids gt">${esc((g.gt || []).join(", "))}</td>
      <td class="ids pr">${esc((g.pred || []).join(", "))}</td>
      <td>${esc(g.label || "")}</td></tr>`;
  }).join("");
  const unmatched = (name, list, cls) => (list && list.length)
    ? `<div class="xwhat"><span class="${cls}">${name}</span>:
         <span class="ids">${esc(list.join(", "))}</span></div>` : "";
  return `
    <div class="xsuite">
      <h2>Stage-2 mapping &mdash; GT &harr; prediction alignment</h2>
      <div class="xnote">
        <p>Every ground-truth metric on this page reads element identity from
        this one artifact, judged once per sample and validated mechanically.
        It is a grouping, <strong>not a 1:1 pairing</strong> &mdash; the
        reference may draw three thumbnails where the prediction has one
        image, so a group can hold several ids on either side.</p>
        <p>Ids listed as unmatched are excluded from coverage ratios and
        reported separately: they are structure gaps, already scored by match
        coverage, not sequencing mistakes.</p>
      </div>
      <table class="xalign" style="width:100%">
        <tr><th>group</th><th class="gt">ground truth</th>
            <th class="pr">prediction</th><th>what it is</th></tr>
        ${rows}
      </table>
      ${unmatched("unmatched in reference", a.gt_unmatched, "gt")}
      ${unmatched("unmatched in prediction", a.pred_unmatched, "pr")}
      ${(a.notes && a.notes.length)
        ? `<div class="caveat">validation notes: ${esc(a.notes.join("; "))}</div>` : ""}
    </div>`;
}

/* ---- the animation evaluation tree -------------------------------------
   Six judged nodes, each of which sent one call per frame or per timestep.
   The point of this block is auditability: the prompt shown is rendered
   server-side through the metric's own assembly, and the trace is the judge's
   actual reply for each call -- so a prompt can be tuned against what the
   model really saw and really said, not against a paraphrase. */
function animTrace(node) {
  const t = node.trace || [];
  if (!t.length) return `<div class="sub">no per-call detail recorded</div>`;
  const rows = t.map((c, i) => {
    const who = esc(c.frame || (c.timestep != null ? "t" + c.timestep : "#" + (i + 1)));
    let verdict = "", body = "";
    if (c.score_raw != null) { verdict = c.score_raw + "/10"; body = JSON.stringify(c.assessment || {}, null, 1); }
    else if (c.verdict) { verdict = c.verdict; body = JSON.stringify({generic: c.generic_quality_checks, style: c.style_specific_checks}, null, 1); }
    else if (c.final_band != null) { verdict = "band " + c.final_band + (c.label ? " · " + c.label : ""); body = c.rationale || ""; }
    else if (c.popped) { const n = Object.values(c.popped).flat().length; verdict = n + " popped"; body = (c.reasoning || "") + "\n\n" + JSON.stringify(c.popped, null, 1); }
    else if (c.state_changes) { verdict = (c.state_changes || []).length + " changed"; body = c.justification_reasoning || ""; }
    else { body = JSON.stringify(c, null, 1); }
    return `<tr><td class="k">${who}</td><td>${esc(verdict)}</td>
      <td><details><summary>reply</summary><pre>${esc(String(body).slice(0, 4000))}</pre></details></td></tr>`;
  }).join("");
  return `<table class="ev"><thead><tr><th>call</th><th>verdict</th><th>judge reply</th></tr></thead>
          <tbody>${rows}</tbody></table>`;
}

function animNode(node) {
  const m = node.manifest || {};
  const bits = [];
  if (node.calls) bits.push(`<b>${node.calls}</b> call(s)`);
  if (m.frame_policy) bits.push(`policy <code>${esc(m.frame_policy)}</code>`);
  if (m.frames_judged != null) bits.push(`${m.frames_judged}/${m.frames_available} frames`);
  if (m.frame_long_edge) bits.push(`${m.frame_long_edge}px`);
  if ((node.errors || []).length) bits.push(`<span class="bad">${node.errors.length} error(s)</span>`);

  let state = "";
  if (node.status === "not_specified")
    state = `<div class="xnote">Not specified for this style — recorded as unscored, not as zero. ${esc(node.note || "")}</div>`;
  else if (node.skipped)
    state = `<div class="xnote">skipped: ${esc(node.skipped)}</div>`;

  const pr = node.prompt || {};
  const prompt = pr.error
    ? `<div class="xnote">prompt unavailable: ${esc(pr.error)}</div>`
    : `<details><summary>prompt sent to the judge — ${esc(pr.file)}#${esc(pr.key)}
         (${pr.chars} chars)</summary><pre>${esc(pr.text || "")}</pre></details>
       <details><summary>style adapter only</summary><pre>${esc(pr.adapter || "")}</pre></details>`;

  return `<div class="xmetric">
    <div class="xhead"><b>${esc(node.title)}</b>
      <span class="sub">${bits.join(" &middot; ") || "did not run"}</span></div>
    ${state}${prompt}
    <details><summary>call trace (${node.calls})</summary>${animTrace(node)}</details>
  </div>`;
}

async function loadAnimation(model, id, style, target) {
  let d;
  try {
    // `target` is not optional in a multi-target view: without it this block
    // answers for the primary target while the sub-tab above says "svg", and
    // every prompt, call count and per-frame verdict below belongs to the
    // other representation with nothing on screen to say so.
    const q = target ? `?target=${encodeURIComponent(target)}` : "";
    d = await (await fetch(
      `/api/animation/${encodeURIComponent(model)}/${id}/${style}${q}`)).json();
  } catch (e) { return ""; }
  if (!d || !d.scored) return "";
  const head = [`<b>${d.total_calls}</b> judged call(s) for this cell`];
  if ((d.would_eliminate || []).length)
    head.push(`<span class="bad">would eliminate at: ${d.would_eliminate.join(", ")}</span>`);
  const cl = d.checklist ? `
    <div class="xmetric"><div class="xhead"><b>Shared step · Element checklist</b>
      <span class="sub">1 call &middot; ${(d.checklist.blocks||[]).length} blocks,
      ${(d.checklist.nodes||[]).length} nodes, ${(d.checklist.edges||[]).length} edges</span></div>
      <div class="xwhat">Built once and shared by omission and repetition, so the two
      cannot disagree about what "the elements" are. Derived from the animation
      sequence, not the XML — an element the sequencer never scheduled can never be
      flagged as omitted.</div>
      ${d.checklist_prompt && !d.checklist_prompt.error
        ? `<details><summary>prompt — ${esc(d.checklist_prompt.file)}</summary><pre>${esc(d.checklist_prompt.text)}</pre></details>` : ""}
      <details><summary>checklist contents</summary><pre>${esc(JSON.stringify(d.checklist, null, 1))}</pre></details>
    </div>` : "";
  const unenf = (d.unenforced_rules || []).length ? `
    <div class="xnote"><b>Rules no single-frame call can enforce:</b><br>
      ${d.unenforced_rules.map(esc).join("<br>")}</div>` : "";
  return `<div class="xsuite"><h2>Animation evaluation tree${
      target ? ` <span class="key">${esc(target)}</span>` : ""}</h2>
    <div class="sub">${head.join(" &middot; ")}</div>${unenf}${cl}
    ${(d.nodes || []).map(animNode).join("")}</div>`;
}

/* Which target the Metrics tab is showing. Sub-tabs switch it; the layout
   underneath is identical for every target, which is the point -- a metric
   sits in the same place whichever representation you are reading. */
let XP_TARGET = "tikz";

function setXpTarget(tg) { XP_TARGET = tg; loadExplain(); }

async function loadExplain() {
  const id = $("#sample").value, style = $("#style").value,
        model = $("#xp-model").value;
  if (!id || !style || !model) return;
  $("#xp-status").textContent = "loading…";
  const d = await (await fetch(
    `/api/explain/${encodeURIComponent(model)}/${id}/${style}`)).json();

  const media = (title, tag, inner) => `
    <div class="cell"><h3><span>${title}</span><span class="tag">${tag}</span></h3>
      ${inner}</div>`;
  const vid = u => u ? `<video controls preload="metadata" loop src="${u}"></video>`
                     : `<div class="missing">not generated</div>`;

  // Keep the selection valid when the sample or model changes.
  if (!(d.targets || []).includes(XP_TARGET)) XP_TARGET = d.primary_target || (d.targets || ["tikz"])[0];

  const out = [];
  if ((d.targets || []).length > 1) {
    out.push(`<div class="xtargets">` + d.targets.map(tg =>
      `<button class="xtab ${tg === XP_TARGET ? "active" : ""}"
               onclick="setXpTarget('${tg}')">${esc(tg)}</button>`).join("") +
      `<span class="hintline">same layout for every target &mdash; switch to
        compare the same metric in the same place</span></div>`);
  }
  // Media follows the active sub-tab, falling back to the top-level fields
  // for a single-target model.
  const mt = (d.media_by_target || {})[XP_TARGET] || {};
  const render = mt.render || d.render;
  const pipeVid = mt.pipeline_video !== undefined ? mt.pipeline_video : d.pipeline_video;
  const refVid = mt.reference_video !== undefined ? mt.reference_video : d.reference_video;
  out.push(`
    <div class="xrow">
      ${media("Source figure", "input", `<img src="${d.figure}">`)}
      ${media("Compiled diagram", "stage 1 · " + esc(XP_TARGET),
              `<img src="${render}" onerror="this.outerHTML='<div class=missing>does not compile</div>'">`)}
      ${media("Reference animation", "ground truth · " + esc(XP_TARGET), vid(refVid))}
      ${media("Our animation", esc(d.model || "") + " · " + esc(XP_TARGET),
              vid(pipeVid))}
    </div>`);

  // Frame slideshow. The mp4 plays at 2fps and cannot be stepped, but every
  // per-frame metric below (ASCS, omission, repetition) was computed on ONE
  // frame at a time -- so reading a per-frame verdict means being able to
  // stop on the exact frame the judge was shown.
  out.push(slideshow({ ...d, frames: mt.frames !== undefined ? mt.frames : d.frames },
                     model, id, style, XP_TARGET));

  if (!d.scored) {
    out.push(`<div class="xnote"><p>This sample has not been scored for
      <strong>${esc(style)}</strong>. Run
      <code>python -m img_2_svg_pretraining.animatebench.run_eval all
      --config &lt;cfg&gt; --style ${esc(style)}</code>, then restart the
      viewer &mdash; records are read once at startup.</p></div>`);
  }

  let n = 0;
  for (const s of d.suites) {
    const metrics = s.metrics.map(m => explainMetric(m, `ev${n++}`, d.targets)).join("");
    out.push(`
      <div class="xsuite">
        <h2>${esc(s.title || s.label)}${s.second_judge
          ? ` <span class="key">2nd = ${esc(s.second_judge)}</span>` : ""}</h2>
        ${s.note ? `<div class="xnote">${
          s.note.split("\n\n").map(p => `<p>${mdBold(p)}</p>`).join("")}</div>` : ""}
        ${s.example ? `<div class="xnote xeg">
          <div class="h">${esc(s.example.title)}</div>
          <p>${mdBold(s.example.body)}</p></div>` : ""}
        ${s.error ? `<div class="caveat">error: ${esc(s.error)}</div>` : ""}
        ${s.skipped ? `<div class="caveat">coverage skipped: ${esc(s.skipped)}</div>` : ""}
        ${metrics}
      </div>`);
  }

  if (d.scored) out.push(alignmentBlock(d.alignment || {}));

  const animBlock = await loadAnimation(model, id, style, XP_TARGET);
  if (animBlock) out.push(animBlock);

  const p = d.provenance;
  if (p) out.push(`<div class="sub">scored by ${esc(p.judge_model || "—")}
    &middot; config ${esc(p.config || "—")}
    &middot; fingerprint <code>${esc(p.config_fingerprint || "—")}</code>
    &middot; ${esc(p.timestamp || "")}</div>`);

  $("#xp-body").innerHTML = out.join("");
  $("#xp-status").textContent = d.scored
    ? `${d.suites.length} suite(s) · ${d.frames} frame(s)` : "not scored";
}

/* ---- Frame slideshow (Metrics tab only) -----------------------------
   Steppable frames, which the 2fps mp4 is not. Every per-frame metric in
   this tab -- ASCS verdicts, omission pops, repetition counts -- was judged
   on a single frame, so the evidence is only checkable if you can stop on
   that frame.

   Frames are served one at a time by /api/frame/<label>/<id>/<style>/<i>
   rather than preloaded: a 26-frame deck at full resolution is tens of MB,
   and the browser only ever needs the one on screen. */
const SLIDES = { timer: null, i: 0, n: 0, base: "", q: "" };

function slideshow(d, label, id, style, target) {
  stopSlides();
  SLIDES.n = d.frames || 0;
  SLIDES.i = 0;
  SLIDES.base = `/api/frame/${encodeURIComponent(label)}/${id}/${style}`;
  SLIDES.q = target ? `?target=${encodeURIComponent(target)}` : "";
  if (!SLIDES.n) {
    return `<div class="xslides"><h3>Frames <span class="tag">slideshow</span></h3>
      <div class="missing">no exported frames for this cell</div></div>`;
  }
  return `
    <div class="xslides">
      <h3>Frames <span class="tag">${SLIDES.n} frame(s) &middot; what the
        per-frame judges each saw</span></h3>
      <div class="stage"><img id="sl-img" src="${SLIDES.base}/0${SLIDES.q}" alt="frame 1"></div>
      <div class="ctl">
        <button onclick="stepSlide(-1)" title="previous frame">&#9664;</button>
        <button id="sl-play" onclick="toggleSlides()">&#9654; play</button>
        <button onclick="stepSlide(1)" title="next frame">&#9654;&#9654;</button>
        <input id="sl-range" type="range" min="0" max="${SLIDES.n - 1}" value="0"
               oninput="showSlide(+this.value)">
        <span class="pos" id="sl-pos">1 / ${SLIDES.n}</span>
      </div>
      <div class="hint">Frames are in playback order, the same order the judges
        walked. A node that samples a subset (sliding bounding box scores
        omission and repetition on every 4th frame) names the frames it
        actually saw in its own <code>frame</code> field below.</div>
    </div>`;
}

function showSlide(i) {
  if (!SLIDES.n) return;
  SLIDES.i = (i + SLIDES.n) % SLIDES.n;
  const img = document.getElementById("sl-img");
  const range = document.getElementById("sl-range");
  const pos = document.getElementById("sl-pos");
  if (!img) return stopSlides();          // view was re-rendered underneath us
  img.src = `${SLIDES.base}/${SLIDES.i}${SLIDES.q || ""}`;
  img.alt = `frame ${SLIDES.i + 1}`;
  if (range) range.value = SLIDES.i;
  if (pos) pos.textContent = `${SLIDES.i + 1} / ${SLIDES.n}`;
}

function stepSlide(delta) { stopSlides(); showSlide(SLIDES.i + delta); }

function stopSlides() {
  if (SLIDES.timer) { clearInterval(SLIDES.timer); SLIDES.timer = null; }
  const b = document.getElementById("sl-play");
  if (b) b.innerHTML = "&#9654; play";
}

function toggleSlides() {
  if (SLIDES.timer) return stopSlides();
  // 2fps, matching the exporter's own fps so the pacing matches the mp4.
  SLIDES.timer = setInterval(() => showSlide(SLIDES.i + 1), 500);
  const b = document.getElementById("sl-play");
  if (b) b.innerHTML = "&#10073;&#10073; pause";
}

/* The suite notes use **bold** for the one or two phrases that carry the
   point; everything else is escaped. */
function mdBold(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

async function load() {
  const id = $("#sample").value, style = $("#style").value;
  if (!id || !style) return;
  $("#status").textContent = "loading…";
  const d = await (await fetch(`/api/compare/${id}/${style}`)).json();

  const cells = [];

  // 1. Ground truth: the source figure the whole pipeline starts from.
  cells.push(`
    <div class="cell">
      <h3><span>Ground truth &mdash; source figure</span><span class="tag">input</span></h3>
      <img src="${d.figure}">
      <div class="sub">${d.title || ""}</div>
    </div>`);

  // 2. The author's real conference talk, when the bundle shipped one.
  if (d.presentation) {
    const p = d.presentation;
    cells.push(`
      <div class="cell talk">
        <h3><span>Original presentation</span><span class="tag">author talk</span></h3>
        ${p.video
          ? `<video controls preload="metadata" src="${p.video}"></video>`
          : `<div class="missing">no video in bundle</div>`}
        <div class="meta">
          ${esc(p.title || "")}<br>
          ${p.uploader ? esc(p.uploader) + " &middot; " : ""}${p.duration ? Math.round(p.duration / 60) + " min" : ""}
          ${p.url ? ` &middot; <a href="${p.url}" target="_blank" rel="noopener">source</a>` : ""}
        </div>
        ${p.transcript ? `<div class="transcript">${esc(p.transcript)}</div>` : ""}
      </div>`);
  }

  // 3. The benchmark's own animation for this style -- one per target
  // actually in play among the panels below, so a tikz model is paired
  // against the tikz reference and an svg model against the svg one rather
  // than everything being compared to a single hardcoded tikz video.
  const revs = (d.reference.reviews || [])
    .filter(r => (r.questionnaire || []).length)
    .map(r => `v${r.version}: ${r.questionnaire.join(", ")}`).join(" · ");
  const refTargets = Object.keys(d.references || {}).sort();
  refTargets.forEach(target => {
    const ref = d.references[target];
    cells.push(panelCell(
      `Reference (AnimateBench)`, `${target} · full context`,
      ref.video,
      revs ? `<span class="pill warn">human review: ${revs}</span>` : "",
      d.reference.available_keys.length
        ? `no ${target}/full-context video for this style`
        : "no reference videos imported",
      `script-ref-${target}`));
  });

  // 3-5. One per model.
  // Group a model's targets into ONE full-width row so tikz and svg sit
  // literally side by side. Left to the 2-column grid they land on separate
  // rows whenever the count ahead of them is odd, which is exactly the
  // comparison the pair exists to make.
  const byModel = {};
  d.panels.forEach((p, i) => { (byModel[p.model_label || p.label] ||= []).push({ p, i }); });
  Object.entries(byModel).forEach(([, group]) => {
    if (group.length > 1) {
      cells.push(`<div class="pairrow" style="grid-template-columns:repeat(${group.length},minmax(0,1fr))">`);
    }
    group.forEach(({ p, i }) => {
    cells.push(panelCell(
      p.label, `${p.model} · ${p.target}`, p.video,
      seqPills(p.sequence) +
        (p.frames ? `<span class="pill">${p.frames} frames</span>` : "") +
        (!p.video && p.code ? `<span class="pill warn">code, no render</span>` : ""),
      p.code ? "animation code exists but did not render" : "not generated yet",
      `script-${i}`, p.metrics));
    });
    if (group.length > 1) cells.push(`</div>`);
  });

  $("#grid").innerHTML = cells.join("");
  const done = d.panels.filter(p => p.video).length;
  $("#status").textContent = `${done}/${d.panels.length} model outputs ready`;

  // Narration is fetched per panel after the grid renders, so a slow or
  // missing script never delays the videos appearing. One reference
  // narration fetch per target shown, matching the reference cells above.
  refTargets.forEach(target => {
    loadScript(`script-ref-${target}`,
      `/api/reference-sequence/${id}/${style}?target=${target}`, j => j);
  });
  d.panels.forEach((p, i) => {
    if (!p.sequence) {
      renderScript(document.getElementById(`script-${i}`), null, "no sequence generated");
      return;
    }
    // p.label may read "Model · svg"; the endpoint wants the bare label plus
    // an explicit target, so send p.target rather than parsing the caption.
    loadScript(`script-${i}`,
      `/api/sequence/${encodeURIComponent(p.model_label || p.label)}/${id}/${style}` +
      `?target=${encodeURIComponent(p.target || "")}`, j => j.bench);
  });
}

async function loadScript(elId, url, pick) {
  const el = document.getElementById(elId);
  if (!el) return;
  try {
    const r = await fetch(url);
    if (!r.ok) { renderScript(el, null, `not available (HTTP ${r.status})`); return; }
    const j = await r.json();
    if (j.error) { renderScript(el, null, j.error); return; }
    renderScript(el, pick(j));
  } catch (e) {
    renderScript(el, null, String(e));
  }
}

/* Scoped to the visible tab: play-all must not start videos the reviewer
   cannot see on another tab. */
const vids = () => Array.from(
  document.querySelectorAll(".view.active video"));
function playAll()    { vids().forEach(v => v.play().catch(() => {})); }
function pauseAll()   { vids().forEach(v => v.pause()); }
function restartAll() { vids().forEach(v => { v.currentTime = 0; v.play().catch(() => {}); }); }

document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.code === "Space") { e.preventDefault();
    vids().some(v => !v.paused) ? pauseAll() : playAll(); }
  if (e.key === "r") restartAll();
});

boot();
</script>
