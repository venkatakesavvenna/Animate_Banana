# AnimateBanana ablation: Narration Drafter w/o Context
#
# GENERATED by scripts/make_ablation_configs.py -- edit that, not this file.
#
# Backbone: Gemini 3.7 Flash, identical to bench_v5_or_gemini37flash.yaml in
# every respect except the one ablated setting below (and cache_root).
#
# CACHE IS ISOLATED. All eight ablations run the same model for every agent, so
# they share one CachePaths lineage; without a separate cache_root each would
# silently reuse the previous ablation's artifacts instead of generating its
# own, and the table would show eight copies of one run.
#
# Critics: stage1=on, stage2=on, stage3=on
dataset:
  root: /fsxvision_new/venkat.kesav/img_2_svg_pretraining/data/animatebench_v5
  limit: 0
cache_root: /fsxvision_new/venkat.kesav/img_2_svg_pretraining/data/ablation_cache/narration_no_context
animation_style: progressive_reveal
target: svg
backends:
  openrouter_gemini37flash:
    type: openai_compat
    base_url: https://openrouter.ai/api/v1
    model: google/gemini-3.7-flash
    api_key_env: OPEN_ROUTER_KEY
    max_concurrency: 4
  qwen_judge:
    type: openai_compat
    base_url: http://127.0.0.1:8010/v1
    model: Qwen/Qwen3-VL-235B-A22B-Instruct
    api_key: EMPTY
    max_concurrency: 8
  kimi_judge:
    type: openai_compat
    base_url: http://127.0.0.1:8011/v1
    model: moonshotai/Kimi-K2.6
    api_key: EMPTY
    max_concurrency: 8
    default_params:
      extra_body:
        chat_template_kwargs:
          thinking: false
transmuter:
  code_converter:
    backend: openrouter_gemini37flash
    prompt: diagram_transmuter/svg_diagram_to_code.yaml#prompt
    params:
      temperature: 0.2
      max_tokens: 65536
  raster_integrator:
    enabled: true
    backend: openrouter_gemini37flash
    params:
      temperature: 0.0
      max_tokens: 65536
  diagram_critic:
    enabled: true
    backend: openrouter_gemini37flash
    prompt: diagram_transmuter/critic.yaml
    fidelity_threshold: 0.7
    max_rounds: 3
    params:
      temperature: 0.1
      max_tokens: 65536
planner:
  strategizer:
    backend: openrouter_gemini37flash
    prompt: animation_planner/strategizer.yaml#full-context-prompt
    context_tier: full
  parser:
    backend: openrouter_gemini37flash
    prompt: animation_planner/svg_parser.yaml#prompt
    params:
      temperature: 0.0
      max_tokens: 65536
  sequencer:
    backend: openrouter_gemini37flash
    prompt: animation_planner/svg_sequencer.yaml#new_prompt
    params:
      temperature: 0.3
      max_tokens: 65536
  critic:
    enabled: true
    backend: openrouter_gemini37flash
    prompt: animation_planner/critic.yaml#prompt
    max_rounds: 2
    params:
      temperature: 0.2
      max_tokens: 65536
  narrative_writer:
    backend: openrouter_gemini37flash
    prompt: animation_planner/narrative_writer.yaml
    context_tier: image_only
    params:
      temperature: 0.3
      max_tokens: 65536
animator:
  designer:
    backend: openrouter_gemini37flash
    prompt: animation_designer/svg_designer.yaml#{style}
    params:
      temperature: 0.2
      max_tokens: 65536
  critic:
    enabled: true
    backend: openrouter_gemini37flash
    prompt: animation_designer/critic.yaml#prompt
    max_rounds: 3
    compile_check: true
    params:
      temperature: 0.2
      max_tokens: 65536
  exporter:
    outputs:
    - mp4
    fps: 2
    dpi: 300
