# Default pipeline configuration.
#
# Every agent names a backend independently, so a run can mix a commercial
# API for one agent with local open weights for another. Copy this
# file and edit rather than editing it in place.

dataset:
  root: /code/data/test_benchmark
  limit: 0                      # 0 = all samples

animation_style: progressive_reveal   # progressive_reveal | sliding_bbox | highlight_dim | zoom_pan
target: tikz                          # tikz | svg

# API keys resolve from, in order: an inline `api_key`, the `api_key_env` var,
# then the gitignored `api_keys.csv` at the repo root (`Key, Service` header).
# Gemini quotas are per key, so all matching keys are pooled and rotated on 429.
backends:
  gemini_pro:
    type: gemini
    # gemini-2.5-pro and gemini-3-pro-preview are quota-limited on these keys;
    # verify with `models.list()` before switching.
    model: gemini-3-pro-preview
    max_concurrency: 2

  gemini_flash:
    type: gemini
    model: gemini-3.6-flash
    max_concurrency: 4

  # Local open weights, in-process. See configs/hf_local.yaml for an all-local
  # run, and backends/hf_local.py for why it is transformers and not a server.
  gemma4_12b:
    type: hf_local
    hf_repo: google/gemma-4-12B-it
    model: gemma4-12b
    attn_implementation: eager

transmuter:
  code_converter:
    backend: gemini_flash
    prompt: diagram_transmuter/tikz_diagram_to_code.yaml#prompt
    params:
      temperature: 0.2
      max_tokens: 16384

  # Stage 1b. One call: the VLM is shown the source figure plus the
  # placeholders stage 1a emitted, and returns a bounding box per placeholder
  # it can locate. Crops are cut from the source and spliced in. No separate
  # vision checkpoints, so only one model is ever loaded.
  raster_integrator:
    enabled: true
    backend: gemini_flash
    params:
      # Detection should be reproducible; this is a localisation task, not a
      # generative one.
      temperature: 0.0
      max_tokens: 4096

  # Stage 1c. Renders the code, compares it with the source figure, and
  # repairs what differs. Gated on rendering fidelity: code already scoring
  # >= fidelity_threshold costs one scoring call and nothing more, so a good
  # sample is cheap. Exists because 1a/1b are write-only -- nothing had ever
  # looked at what the code actually draws, and a document can compile with
  # zero warnings while rendering almost nothing (observed on pipe00041,
  # where every `fit` block painted over its own children).
  diagram_critic:
    enabled: true
    backend: gemini_pro
    prompt: diagram_transmuter/critic.yaml
    fidelity_threshold: 0.7
    max_rounds: 3
    params:
      # Scoring wants determinism; the repair benefits from a little room.
      temperature: 0.1
      max_tokens: 32768

planner:
  strategizer:
    backend: gemini_flash
    prompt: animation_planner/strategizer.yaml#full-context-prompt
    context_tier: full          # image_only | caption | abstract | full
    params:
      temperature: 0.3

  parser:
    backend: gemini_flash
    prompt: animation_planner/tikz_parser.yaml#prompt
    params:
      temperature: 0.0
      max_tokens: 16384

  sequencer:
    backend: gemini_flash
    prompt: animation_planner/sequencer.yaml#prompt
    params:
      temperature: 0.3
      # A sequence with narration per node runs long; 8192 truncated mid-JSON
      # on a 7-stage figure.
      max_tokens: 32768

  critic:
    backend: gemini_flash
    prompt: animation_planner/critic.yaml#prompt
    max_rounds: 2
    use_set_of_mark: true
    params:
      temperature: 0.2
      # Returns the whole corrected sequence, not a diff, so it needs at
      # least as much room as the sequencer.
      max_tokens: 32768

  # Stage 2e. Writes the spoken narration into the finished sequence -- only
  # the `narrative` field changes, the structure is grafted back verbatim.
  # The prompt reference deliberately carries no '#key': the variant is chosen
  # from context_tier at runtime (image_only gets the visually-grounded
  # prompt, everything else the paper-grounded one).
  narrative_writer:
    backend: gemini_flash
    prompt: animation_planner/narrative_writer.yaml
    context_tier: full
    params:
      temperature: 0.3
      # Echoes the whole sequence back with narration added, so it needs at
      # least as much room as the sequencer.
      max_tokens: 32768

animator:
  designer:
    backend: gemini_flash
    prompt: animation_designer/designer.yaml#prompt
    params:
      temperature: 0.2
      max_tokens: 16384

  critic:
    backend: gemini_flash
    prompt: animation_designer/critic.yaml#prompt
    max_rounds: 3
    compile_check: true
    params:
      temperature: 0.2

  exporter:
    outputs: [pdf, mp4, gif, pptx, narrated_mp4]
    fps: 2
    dpi: 300
