# V2-DATASET VARIANT of bench_v3_zeroshot_gemini31.yaml.
#
# Six samples in this study (CVPR_2025_pipe000{04,10,11,41,45,137}) exist only
# under data/animatebench_v2 -- they were dropped from v3. `run_pipeline` takes
# its dataset root from the config and has no --dataset override, so a second
# config is the only way to reach them.
#
# `cache_root` is DELIBERATELY UNCHANGED. Artifacts are keyed by model lineage,
# not by dataset, so these exports land beside the v3 ones in a single tree and
# the viewer sees one coherent Zeroshot model rather than two.
#
# AnimateBench v3 -- SVG target, Zeroshot Gemini 3.1. IMPORT ONLY, NEVER RUN.
#
# THIS CONFIG MAKES NO API CALLS AND MUST NOT BE USED WITH `run_pipeline all`.
# The animations it describes were produced outside this repo and shipped as
# finished SVGs in data/metrics/Zeroshot_Gemini_3.1_SVGs.zip. Only the `export`
# stage is ever run against it, to rasterise those SVGs into frames + mp4.
#
# WHY A CONFIG EXISTS FOR A MODEL THAT IS NEVER CALLED. Two pieces of machinery
# are keyed off one:
#   * `CachePaths` derives every artifact directory from the MODEL strings here,
#     so this is what gives the imported SVGs a lineage of their own.
#   * `results.suite_path` keys eval records by the config's FILENAME STEM, so a
#     config file is the only way for this model to get a row in the viewer.
# The agent blocks below are therefore scaffolding: they name a model so paths
# resolve, and they will never execute.
#
# STYLE IS progressive_reveal, AND THAT IS MEASURED, NOT ASSUMED. Every shipped
# SVG animates `.reveal { opacity: 0; animation: fadeIn ... forwards; }` across
# five staggered `animation-delay` phases -- opacity 0 -> 1, fill-mode forwards,
# nothing ever hidden again. That is cumulative progressive reveal by definition.
#
# WHAT THIS MODEL CAN AND CANNOT BE SCORED ON. It ships a finished animation
# with no intermediate representation -- no parser XML, no sequence. `run_eval`
# builds `step_frames_` only when BOTH a sequence and an XML exist, and SSS/GPS
# and the omission checklist are all gated on that, so those three metrics are
# SILENTLY ABSENT for this model (no error, no warning). It is comparable on
# `vfs_band` and `ascs_video` only.
#
# Do NOT synthesise an XML or sequence to make the other metrics "work". Those
# metrics score a pipeline's own plan against its own frames; a plan reverse-
# engineered from the finished output would score near-perfectly by construction
# and would be the most misleading number in the study.

dataset:
  root: /fsxvision_new/venkat.kesav/img_2_svg_pretraining/data/animatebench_v2
  limit: 0

cache_root: /fsxvision_new/venkat.kesav/img_2_svg_pretraining/data/animatebench_v3_cache

animation_style: progressive_reveal
target: svg

backends:
  # Scaffolding only -- never invoked. The `model:` string is what names every
  # cache directory for the imported artifacts; it is not a callable endpoint.
  zeroshot_import:
    type: openai_compat
    base_url: https://openrouter.ai/api/v1
    model: google/gemini-3.1-zeroshot
    api_key_env: OPEN_ROUTER_KEY
    # 4, as on the Gemini side: a shared paid endpoint, and the bill is per
    # token rather than per hour, so more concurrency buys nothing but a faster
    # route to the $3 cap.
    max_concurrency: 4

  # Video judge for the vfs_video (E1b) node only. Native `gemini`, not the
  # OpenRouter route: OpenRouter's openai-compatible schema has no verified
  # video part type, and openai_compat now raises rather than silently dropping
  # one. Free-tier Google keys make the whole video study cost nothing.
  #
  # max_concurrency 2, not 8. Eight threads over this key pool once landed ZERO
  # calls in thirty minutes: each thread marked keys exhausted until the ring
  # had cleared every mark and started again on dead ones. The quota here is
  # per DAY (20/key), which KeyRing's per-minute-shaped backoff does not model.
  # PAID video judge, via OpenRouter. Same model as `gemini_video`, different
  # transport -- use when the free-tier Google pool is exhausted.
  #
  # WHY THIS EXISTS. The 75 free keys are 20 requests/DAY each. Running the
  # 38-cell sweep and pilot scorings together drained them into sustained 429
  # RESOURCE_EXHAUSTED, and judging fell to 3 cells/hour while workers retried.
  #
  # MEASURED COST, not estimated: 12592 prompt + 146 completion tokens per call
  # at $0.375/M in and $1.875/M out = ~$0.0041/call. Two calls per cell, ~100
  # model-cells, so the ENTIRE video-judging bill is about $0.83. That is small
  # enough that waiting on free quota costs more in wall clock than it saves.
  #
  # max_concurrency 6, not 2: the free-tier value was shaped around a per-DAY
  # key quota where aggressive threading raced keys into exhaustion. A paid
  # single-key endpoint has no such failure mode.
  #
  # NOTE the media_resolution param is NOT set here. It is a native-Gemini
  # GenerateContentConfig field that the OpenAI-compatible route does not
  # accept, so frames arrive at the default ~60 tokens each rather than ~250.
  # Criterion 6 of the fidelity prompt (text legibility) is therefore weaker on
  # this route than on `gemini_video`. Do not mix the two judges' scores for
  # that criterion without saying which produced them.
  gemini_video_paid:
    type: openai_compat
    base_url: https://openrouter.ai/api/v1
    model: google/gemini-3.7-flash
    api_key_env: OPEN_ROUTER_KEY
    max_concurrency: 6

  gemini_video:
    type: gemini
    model: gemini-3.7-flash
    max_concurrency: 1
    default_params:
      # MEASURED, not guessed. Gemini samples inline video at exactly 1 frame
      # per second (token cost is perfectly linear in duration: 60 tokens per
      # frame at 2/5/10/20/40 frames), and tokenizes those frames far more
      # coarsely than a still image -- 60 vs ~700 tokens for the same diagram.
      # Criterion 6 of the video prompt asks about text legibility, which at 60
      # tokens/frame the model cannot assess because it cannot read the labels.
      # HIGH restores ~250 tokens/frame, comparable to how the frame judge sees
      # them, so a frames-vs-video disagreement is about the modality rather
      # than about resolution. Costs ~$0.19 for all 64 cells on the paid route,
      # $0 on free-tier keys.
      media_resolution: MEDIA_RESOLUTION_HIGH

  # SSS / GPS judge for the letter-band rubric. Frame-level, so it needs image
  # input but not video: the question is about a pair of consecutive stills and
  # the XML they map onto.
  #
  # A DIFFERENT FAMILY FROM BOTH GENERATORS ON PURPOSE. Scoring Gemini's output
  # with Gemini, or Qwen3.8-27B's with Qwen3.8-27B, is the circular evaluation
  # this repo's notes warn about; a shared judge keeps the two comparable and
  # neither self-preferring.
  #
  # Cheap enough not to need rationing: $0.16/M in, $0.47/M out, against
  # Qwen3.8-27B's $2.55/M out.
  qwen38_flash_judge:
    type: openai_compat
    base_url: https://openrouter.ai/api/v1
    model: qwen/qwen3.8-flash
    api_key_env: OPEN_ROUTER_KEY
    # 8, and this is now the ONE knob that matters: `_banded_workers` reads it
    # to size the timestep pool, so raising it here parallelises SSS/GPS rather
    # than only allowing concurrency the sequential driver never used.
    max_concurrency: 8

  qwen_judge:
    type: openai_compat
    base_url: http://127.0.0.1:8010/v1
    model: Qwen/Qwen3-VL-235B-A22B-Instruct
    api_key: EMPTY
    max_concurrency: 8

transmuter:
  code_converter:
    backend: zeroshot_import
    prompt: diagram_transmuter/svg_diagram_to_code.yaml#prompt
    params:
      temperature: 0.2
      # Doubled as on the TikZ side: reasoning tokens are billed as output and
      # spend this budget before a single tag is emitted.
      max_tokens: 32768

  raster_integrator:
    enabled: true
    backend: zeroshot_import
    params:
      temperature: 0.0
      max_tokens: 32768

  diagram_critic:
    enabled: true
    backend: zeroshot_import
    prompt: diagram_transmuter/critic.yaml
    fidelity_threshold: 0.7
    max_rounds: 3
    params:
      temperature: 0.1
      max_tokens: 32768

planner:
  # Declared, never run. See the header.
  strategizer:
    backend: zeroshot_import
    prompt: animation_planner/strategizer.yaml#full-context-prompt
    context_tier: full

  parser:
    backend: zeroshot_import
    prompt: animation_planner/svg_parser.yaml#prompt
    params:
      temperature: 0.0
      max_tokens: 32768

  sequencer:
    backend: zeroshot_import
    prompt: animation_planner/svg_sequencer.yaml#new_prompt
    # context_tier deliberately unset: the bench sequencer prompt names its
    # own three inputs and plans traversal from them. Setting it (to
    # caption/abstract/full) feeds the paper's prose in as well AND appends
    # `ctx-<tier>` to the sequence lineage, so the two variants never share a
    # cache entry. Left off here so SVG stays comparable with the TikZ run.
    params:
      temperature: 0.3
      max_tokens: 32768

  critic:
    enabled: true
    backend: zeroshot_import
    prompt: animation_planner/critic.yaml#prompt
    max_rounds: 2
    params:
      temperature: 0.2
      max_tokens: 32768

  narrative_writer:
    backend: zeroshot_import
    prompt: animation_planner/narrative_writer.yaml
    # The one stage that genuinely wants the paper's own words.
    context_tier: full
    params:
      temperature: 0.3
      max_tokens: 32768

animator:
  designer:
    backend: zeroshot_import
    # Style-keyed, unlike the TikZ designer. `{style}` is expanded at run time
    # by designer._resolve_prompt, which also maps the two keys whose names
    # differ from the pipeline's (hopping_box / sliding_box). One config now
    # serves every style instead of a near-duplicate per style -- which is
    # exactly how a config's style and its designer prompt drift apart.
    prompt: animation_designer/svg_designer.yaml#{style}
    params:
      temperature: 0.2
      max_tokens: 32768

  critic:
    enabled: true
    backend: zeroshot_import
    prompt: animation_designer/critic.yaml#prompt
    max_rounds: 3
    compile_check: true
    params:
      temperature: 0.2
      max_tokens: 32768

  exporter:
    # mp4 only -- no pdf for SVG (see header). mp4 also writes exports/frames/.
    outputs: [mp4]
    fps: 2
    dpi: 300
