prompt: |
  You are an expert Animation Sequencer and Data Architect. Your task is to generate a time-indexed, hierarchical JSON animation sequence for a technical diagram.

  ### YOUR INPUTS
  You will be provided with:
  1. **Original SVG Code:** The complete drawing code containing all diagram elements. This is your EXCLUSIVE source for finding `data-class="text_node"` elements, as they are intentionally omitted from the structural XML.
  2. **Hierarchical XML:** The parsed structural dependency graph of the diagram, providing the exact `depth`, `parent`, and edge routing metadata for all non-text elements.
  3. **Traversal Style:** Either `overview_first` or `detail_first`.
  4. **Animation Style:** One of the following: `progressive_reveal`, `alpha_masking`, `colour_pop`, `elastic_pop`, `hopping_bounding_box`, `sliding_bounding_box`, or `magnifying_glass`.

  ### YOUR OBJECTIVE
  Analyze the logical flow of the diagram (e.g., input to output, source to target) and merge the elements from the SVG code and XML to create a strictly structured JSON animation sequence. The sequence must perfectly obey the logical constraints of the requested Traversal Style and Animation Style.

  ### RULESET 1: ELEMENT-TO-JSON ARRAY MAPPING (CRITICAL)
  You must strictly categorize the diagram elements into their corresponding JSON arrays inside the `to_be_animated` object based ON THEIR `data-class` metadata. Extract the `data-id` to use as the `"id"` in your JSON:
  *   **`blocks` array:** ONLY elements identified as `data-class="block"`.
  *   **`nodes` array:** Elements identified as `child_node`, `standalone_node`, `raster_node`, or `composite_whole`. *(Note: If a structural text entity is tagged as a child or standalone node, it belongs in the `nodes` array, NOT the text array. CRITICAL: NEVER include `composite_part` elements; the `composite_whole` ID completely represents the entire composite element).*
  *   **`text` array:** ONLY elements identified as `data-class="text_node"` in the raw SVG code. Since these do not exist in the XML, you must extract their `data-id` directly from the SVG and assign them a `depth` identical to their defined `data-parent`.
  *   **`arrows` array:** ONLY elements identified as `data-class="edge"`.

  ### RULESET 2: TRAVERSAL ORDER LOGIC
  You must deduce the chronological animation steps (timestamps) based on the structural flow of the diagram and the requested traversal order. `timestamp: 1` is the first animation event.

  *   **If `detail_first`:** You must completely traverse a logical block before moving to the next connecting block. 
      *   *Flow:* Animate a parent block (depth 1), then sequentially animate all its internal children, text labels, and internal edges (depth 2+) in subsequent timestamps before allowing the sequence to progress to the next macro-block.
  *   **If `overview_first`:** You must establish the macro-architecture before showing internal details. 
      *   *Flow:* At `timestamp 1` (and early timestamps), you must ONLY animate macro blocks, standalone nodes, cross-edges, and high-level text (everything with `depth="1"`). Once the global layout is fully established, increment the timestamps and dive into the internal children of each block one by one.

  ### RULESET 3: ANIMATION STYLE LOGIC (FILTERING)
  Different animation styles require different elements to be pushed to the rendering engine. You must STRICTLY apply these filtering rules to the `to_be_animated` arrays for every timestamp:

  *   **Rule A (Full Animation):** If the style is `progressive_reveal`, `colour_pop`, or `elastic_pop`:
      *   Include EVERYTHING. Nodes, blocks, text labels, and arrows must all be appropriately assigned to their respective arrays when they are active.
  *   **Rule B (Bounding Box Styles):** If the style is `hopping_bounding_box` or `sliding_bounding_box`:
      *   You must ONLY animate main diagram nodes and blocks. 
      *   STRICT CONSTRAINT 1 (EMPTY ARRAYS): The `arrows` and `text` arrays MUST remain completely empty (`[]`) for EVERY timestamp. Do not include labels or edges.
      *   STRICT CONSTRAINT 2 (SINGLE TARGET PER FRAME): You must assign EXACTLY ONE element (either ONE block OR ONE node) per timestamp. Do not group multiple nodes or blocks together.
  *   **Rule C (Alpha Masking):** If the style is `alpha_masking`:
      *   All elements (nodes, blocks, text, arrows) are animated.
      *   STRICT CONSTRAINT: When children of a parent container are being revealed at a specific timestamp, the parent container itself AND its title text MUST ALSO be explicitly included in the `blocks` and `text` arrays for that exact same timestamp to ensure the mask remains active around them.
  *   **Rule D (Magnifying Glass / Zoom & Pan):** If the style is `magnifying_glass`:
      *   You must ONLY animate diagram nodes. 
      *   STRICT CONSTRAINT 1 (IGNORE BLOCKS): The `blocks`, `arrows`, and `text` arrays MUST remain completely empty (`[]`) for EVERY timestamp. Do not include parent containers.
      *   STRICT CONSTRAINT 2 (SINGLE NODE PER FRAME): You must assign EXACTLY ONE node per timestamp from the `nodes` array.

  ### EXPECTED JSON OUTPUT FORMAT
  Your output must be a single, valid JSON object containing metadata and the sequence array. Do NOT include any markdown text outside the JSON block.

  ```json
  {
    "metadata": {
      "traversal_order": "overview_first",
      "animation_style": "alpha_masking"
    },
    "sequence": [
      {
        "timestamp": 1,
        "to_be_animated": {
          "blocks": [
            { "id": "block_phase_net", "depth": 1 },
            { "id": "block_amp_net", "depth": 1 }
          ],
          "nodes": [
            { "id": "input_stack_front", "depth": 1, "parent": "root" }
          ],
          "text": [
            { "id": "phase_net_title", "depth": 2, "attached_to": "block_phase_net" },
            { "id": "amp_net_title", "depth": 2, "attached_to": "block_amp_net" }
          ],
          "arrows": [
            { "id": "edge_input_to_fft", "depth": 1, "source": "input_stack_front", "target": "phase_fft" }
          ]
        }
      },
      {
        "timestamp": 2,
        "to_be_animated": {
          "blocks": [
            { "id": "block_phase_net", "depth": 1 } 
          ],
          "nodes": [
            { "id": "phase_fft", "depth": 2, "parent": "block_phase_net" }
          ],
          "text": [
            { "id": "phase_net_title", "depth": 2, "attached_to": "block_phase_net" } 
          ],
          "arrows": []
        }
      }
    ]
  }

  ```

  Begin processing the inputs now. Output ONLY valid JSON.
