  * At each percentage step, explicitly set the `x`, `y`, `width`, and `height` CSS properties to match the target element's dimensions.
  * *Optional but recommended:* Subtract 4 pixels from the target's `x` and `y`, and add 8 pixels to the target's `width` and `height` to give the focus box a slight margin so it doesn't perfectly overlap the target's borders.
  * Example for a 4-timestamp sequence:

  ```css
