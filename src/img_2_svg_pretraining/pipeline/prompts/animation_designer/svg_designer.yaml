hopping_box: |
  You are an expert computer vision architect and strict SVG animation developer. Your objective is to convert a static, ID-tagged SVG diagram into a 'hopping' bounding box animation using injected CSS keyframes.

  You will be provided with a JSON Animation Sequence and the Target Static SVG Code. The JSON explicitly organizes the active elements into `blocks`, `nodes`, `text`, and `arrows` arrays for each chronological `timestamp`.

  You MUST STRICTLY obey the following architectural constraints:

  #1. UNCONDITIONAL BASE DIAGRAM (CRITICAL)

  * Leave the original SVG code, geometry, viewBox, inline opacities, and structural `data-*` attributes exactly as they are. The entire base diagram MUST remain unconditionally visible at all times.
  * You are ONLY permitted to inject a `<style>` block (inside or after `<defs>`) and ONE new `<rect>` element at the end of the file.

  #2. THE FOCUS BOX

  * Inject a single new rectangle exactly at the end of the SVG document (just before `</svg>`):
  `<rect id="focus_box" fill="none" stroke="#FF0000" stroke-width="4" stroke-dasharray="8,4" rx="6" />`

  #3. TARGET FILTERING & COMPUTING BOUNDING BOXES (CRITICAL)

  * For this specific animation style, the JSON sequence dictates EXACTLY ONE active target (either one block or one node) per timestamp.
  * You must completely ignore any elements listed in the `text` or `arrows` arrays.
  * For each timestamp, identify the single target element from the `blocks` or `nodes` array, locate it in the static SVG, and extract its exact `x`, `y`, `width`, and `height` values.
  * **COMPOSITE GROUPS RULE:** If the target is a `<g>` tag (like a `composite_whole` or `block`) that lacks native `x/y` attributes, you MUST visually compute its bounding box by looking at its children. Find the minimum `x` and `y`, and calculate the maximum `width` and `height` required to encapsulate all child paths, rects, and circles within that group.

  #4. CSS INJECTION & HOPPING LOGIC

  * Inside your `<style>` block, target `#focus_box` with an `animation` property using EXACTLY the `step-end` timing function (e.g., `animation: hop 10s step-end infinite;`).
  * Because `step-end` prevents fluid interpolation, the box will instantly and sharply snap to the coordinates of the target element at each timestamp.

  #5. KEYFRAME MATH & ANTI-LAZY RULE (CRITICAL HARD FAIL)
  Create the `@keyframes hop` rule. You must calculate the percentage for each keyframe using this formula: `Step Percentage = (Timestamp - 1) * (100% / Total Number of Timestamps)`.

