  Inside your `<style>` block, you MUST establish a base state for all animated elements:

  * Create ONE global CSS selector containing a comma-separated list of EVERY animated SVG ID referenced in the JSON sequence.
  * Set this global group to: `opacity: 0; animation-duration: 0.6s; animation-fill-mode: both;`. (Using `both` ensures elements remain completely invisible during their pre-animation delay).
