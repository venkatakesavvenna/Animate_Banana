alpha_masking: |
  You are an expert computer vision architect and strict SVG animation developer. Your objective is to convert a static, ID-tagged SVG diagram into a looping Alpha Masking (ghosting) animation using injected CSS keyframes.

  You will be provided with a Target Image, its Static SVG Code, JSON Animation Sequence. The JSON explicitly organizes the active elements into `blocks`, `nodes`, `text`, and `arrows` arrays for each chronological `timestamp`, and specifies the Traversal Style (`overview_first` or `detail_first`).

  You MUST STRICTLY obey the following architectural constraints:

  #1. ABSOLUTE FIDELITY (CRITICAL)
  - Do not alter the existing `<g>`, `<path>`, `<rect>`, or `<text>` elements. 
  - Do not change the original geometry, coordinates, viewBox, or structural `data-*` attributes.
  - You are ONLY permitted to inject a `<style>` block immediately inside or after the `<defs>` tag.

  #2. CSS INJECTION & THE BASE GHOST LAYER
  - Inside your `<style>` block, apply a default `opacity: 0.15;` to every element that is scheduled to be animated.
  - Bind each element to its respective keyframe animation using its ID. (e.g., `#block_1, #node_2 { animation: anim_X 20s infinite; }`).

  #3. JSON-DRIVEN TARGETING, DAG COMPLIANCE & PARENT PERSISTENCE
  - You must generate your CSS `@keyframes` by mapping the elements listed in the JSON `blocks`, `nodes`, `text`, and `arrows` arrays to their corresponding SVG IDs.
  - **Parent Persistence (Traversal Awareness):** To maintain a strict Directed Acyclic Graph (DAG) for evaluation, the JSON sequence triggers a parent container EXACTLY ONCE (e.g., at its initial appearance in timestamp 1). However, during `overview_first` or `detail_first` traversals, you MUST natively persist the parent container and its title text in your CSS keyframe logic. When the children of a container are triggered at later timestamps, the parent container and its title text MUST automatically remain fully opaque (`opacity: 1.0`), even though they are not explicitly mentioned in the JSON sequence for those later timestamps. The parent must remain triggered throughout the entire duration that ANY of its children are being displayed.
  - *Example:* If the JSON triggers `block_1` at timestamp 1, and its internal children are triggered across timestamps 2, 3, and 4, you must build the CSS keyframe for `#block_1` so it remains at `opacity: 1.0` continuously from timestamp 1 through 4.

  #4. KEYFRAME MATH (CRITICAL)
  - Total Slices = Max Timestamp in JSON.
  - Step Duration % = 100% / Total Slices.
  - Timestamp $T$ active window = `(T - 1) * Step Duration` to `T * Step Duration`.

  #5. DISCRETE OPACITY TRANSITIONS (NO FADING)
  - CSS animations interpolate (fade) by default. You MUST force sharp, discrete transitions to recreate the binary "active/ghosted" masking effect.
  - Write your keyframes with immediately adjacent percentage steps (e.g., a 0.001% difference) to snap the opacity.
  - *Example for an element active ONLY during Timestamp 2 (in a 4-slice 25% system):*
    ```css
    @keyframes anim_nodeA {
      0%       { opacity: 0.15; }
      24.999%  { opacity: 0.15; }
      25%      { opacity: 1.0; }   /* Timestamp 2 starts */
      49.999%  { opacity: 1.0; }   /* Timestamp 2 ends */
      50%      { opacity: 0.15; }
      100%     { opacity: 0.15; }
    }

  #6. DYNAMIC NARRATION BANNER (CRITICAL)
  The JSON contains a narrative` field for timestamps. You MUST embed this narration as a dynamic subtitle at the bottom of the animation.
  - VIEWBOX EXCEPTION: You are explicitly permitted to increase the `viewBox` height and the SVG `height` attribute (e.g., by 100-150 units) to create empty space at the bottom for this banner without overlapping the diagram.
  - INJECTION: At the end of the SVG (before `</svg>`), inject a container `<g id="narration_banner">`. Inside it, for every timestamp where `narrative` is not `null`, inject a `<text>` element with a unique ID (e.g., `id="narr_ts1"`).
  - SVG TEXT WRAPPING (HARD REQUIREMENT): Standard SVG `<text>` does NOT auto-wrap. You MUST logically split long narrative strings into multiple `<tspan x="50%" dy="1.2em">` elements to prevent the text from overflowing the canvas horizontally.
  - STYLING: Horizontally center the text in the canvas (`text-anchor="middle"`, `x="50%"`), position its `y` coordinate in the newly created bottom space, and use a highly legible font (`font-family="sans-serif"`, an appropriate `font-size`, and a dark `fill`).
  - CSS VISIBILITY TIMING: You MUST add CSS logic in your `<style>` block to ensure each narrative text is visible (`opacity: 1`) ONLY during its specific timestamp's active window, and completely hidden (`opacity: 0`) otherwise. 
    - HOLD UNTIL THE NEXT NARRATION STARTS (HARD REQUIREMENT). A narration's visible window runs from its own timestamp until the NEXT narration's timestamp -- not for a fixed short duration. It MUST stay at `opacity: 1` for that entire span. Do NOT fade it back to 0 before the next one appears; the final narration stays visible until the animation ends.
    - THE FAILURE THIS PREVENTS: if a banner's animation `duration` equals the GAP between consecutive narrations (e.g. `bannerFade 0.5s` with delays 0s, 0.5s, 1.0s ...), every subtitle returns to `opacity: 0` at the exact instant the next one begins. Frame extraction samples on those boundaries, so every sampled frame catches opacity 0 and the animation exports with NO visible subtitles. Measured on a real output: 9 of 10 narrations were invisible in every exported frame.
    - CONCRETE RULE: give each banner an animation whose duration covers its FULL span, with keyframes reaching `opacity: 1` early (within the first ~10%) and HOLDING `opacity: 1` at `100%`, using `forwards`. A short fade-IN is fine; a fade-OUT before its successor appears is not.
    - The narration timeline MUST span the whole animation, so the banner is never blank while the diagram is still animating.
    - If the base animation loops using percentage slices, align the banner's opacity keyframes to match the exact percentage window of its timestamp.
    - If the base animation uses `animation-fill-mode: forwards`, you MUST create a custom `@keyframes` rule specifically for the banners so they appear on their timestamp but DISAPPEAR when the next timestamp begins, rather than staying permanently visible like the diagram elements do.

  SVG CODE:
  {svg_code}

  JSON_ANIMATION_SEQUENCE:
  {json_sequence}


