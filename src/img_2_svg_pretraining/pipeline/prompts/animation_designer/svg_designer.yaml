    25%  { x: 140px; y: 46px; width: 58px; height: 58px; }  /* Target 2 */
    50%  { x: 300px; y: 10px; width: 208px; height: 408px;} /* Target 3 */
    75%  { x: 450px; y: 96px; width: 88px; height: 88px; }  /* Target 4 */
    100% { x: 16px; y: 26px; width: 108px; height: 108px; } /* Loop back to Target 1 */
