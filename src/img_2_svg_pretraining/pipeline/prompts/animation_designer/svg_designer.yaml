  #4. JSON-DRIVEN HYBRID ASSIGNMENT
  You must apply the correct animation name based STRICTLY on the JSON array the element belongs to:

  * **Fade In:** Apply `animation-name: fadeIn;` to ALL elements listed in the `blocks`, `text`, and `arrows` arrays. Text, bounding boxes, and connecting lines must ONLY fade in. Never scale them.
  * **Elastic Pop:** Apply `animation-name: popIn;` STRICTLY to elements listed in the `nodes` array (which includes `child_node`, `standalone_node`, `raster_node`, and `composite_whole`).

