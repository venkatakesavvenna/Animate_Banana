[pytest]
pythonpath = ../..
markers =
    integration: exercises real model or processor paths
    large: loads actual model weights
    contract: validates registry and interface contracts
    data: validates VLM/SAM datamodule and collator behavior
    model: validates individual model wrappers
    composite: validates VLMSam integration behavior
    trainer: validates trainer launch and training-step behavior
    cpu: runs on CPU-only environments
    gpu: requires CUDA and runs a real GPU train-step smoke test
    ddp: requires multiple GPUs and runs a distributed smoke test
    dataparallel: requires multiple GPUs and runs a single-process DataParallel smoke test
    external: requires external checkpoints or model references
    slow: intentionally slower integration coverage
