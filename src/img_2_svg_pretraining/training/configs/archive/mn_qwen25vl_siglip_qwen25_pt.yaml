# Qwen2.5-VL-7B | SigLIP (from VLM) | Qwen2.5-7B (raw) | Pre-Train
#
# Pre-training replication for the Qwen family:
#   visual      ← SigLIP from Qwen2.5-VL-7B-Instruct (ve_init_mode=from_vlm)
#   merger      ← random N(0, 0.02)
#   text model  ← Qwen/Qwen2.5-7B base (lm_init_mode=raw_llm)
#
# Note: we keep the native SigLIP ViT from Qwen2.5-VL (ve_init_mode=from_vlm)
# because Qwen2VisionTransformer uses a custom SigLIP variant not available
# as a standalone HF checkpoint. For SigLIP2 from Qwen3-VL, use ve_init_mode=swap_from_vlm.
#
# Batch: 16 GPUs × per_device=2 × grad_accum=1 = global_batch 32

multinode:
  nodes: "3,11"
  gpus_per_node: 8

vlm_family: qwenvlm
base_model: Qwen/Qwen2.5-VL-7B-Instruct
model_family_name: qwen2.5vl
attn_implementation: flash_attention_2

sam_version: none
out_dim: 256

run_name: "mn_qwen25vl_siglip_qwen25_pt"
split_ratio: 0.995
seed: 42

wandb_project: img-2-svg-pretraining
logging_dir: /code/src/img_2_svg_pretraining/training/outputs/mn_qwen25vl_siglip_qwen25_pt/logs
output_dir: /code/src/img_2_svg_pretraining/training/outputs/mn_qwen25vl_siglip_qwen25_pt/checkpoints

checkpoint:
  resume: false
  path: null
  mode: weights_only

trainer:
  deepspeed: /code/src/img_2_svg_pretraining/training/configs/deepspeed/zero3.json

  num_train_epochs: 1

  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 1

  eval_strategy: "steps"
  eval_steps: 500
  save_strategy: "steps"
  save_steps: 1000
  save_total_limit: 3

  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine_with_min_lr"
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  warmup_steps: 200
  weight_decay: 0.0
  max_grad_norm: 1.0

  optim: "adamw_torch"
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-6

  bf16: true
  gradient_checkpointing: true

  logging_steps: 10
  dataloader_num_workers: 4
  report_to: "wandb"
  run_name: ${run_name}

loss:
  ce_loss_weight: 1.0

pretrain_init:
  ve_init_mode: from_vlm        # keep native SigLIP from Qwen2.5-VL
  reset_connector: true
  lm_init_mode: raw_llm
  lm_checkpoint: Qwen/Qwen2.5-7B-Instruct

# Connector LR is 40× ViT: starts from random init.
param_groups:
  - pattern: "backbone\\.qwen\\.visual\\.blocks\\."
    lr: 6.0e-6
    weight_decay: 0.0
  - pattern: "backbone\\.qwen\\.visual\\."
    lr: 2.0e-4
    weight_decay: 0.0
  - pattern: "backbone\\.qwen\\."
    lr: 2.0e-5
    weight_decay: 0.0

datasets:
  train:
    - name: pixmo_cap_local
      dataset_kwargs:
        data_path: /fsxvision_new/pratyush.jena/Datasets/pixmo-cap-images/extracted_dataset
        mode: captions
  val:
    - name: pixmo_cap_local
      dataset_kwargs:
        data_path: /fsxvision_new/pratyush.jena/Datasets/pixmo-cap-images/extracted_dataset
        mode: captions

captioning_eval:
  eval_steps: 500
  num_samples: 64
  max_new_tokens: 256
  do_sample: false
