# Gemma3-12B-IT | SigLIP-896 (from VLM) | Gemma3-12B (from VLM) | Pre-Train
#
#   vision_tower        ← SigLIP from Gemma3-12B-IT (ve_init_mode=from_vlm)
#   multi_modal_projector ← random N(0, 0.02)
#   language_model      ← Gemma3-12B-IT (lm_init_mode=from_vlm)
#
# Nodes: vision-node-003, vision-node-004
# Batch: 16 GPUs × per_device=1 × grad_accum=2 = global_batch 32

multinode:
  nodes: "3,4"
  gpus_per_node: 8

vlm_family: gemmavlm
base_model: google/gemma-3-12b-it
model_family_name: gemma3
attn_implementation: flash_attention_2

sam_version: none
out_dim: 256

run_name: "mn_gemma3_12b_siglip_gemma3_pt"
split_ratio: 0.995
seed: 42

wandb_project: img-2-svg-pretraining
logging_dir: /code/src/img_2_svg_pretraining/training/outputs/mn_gemma3_12b_siglip_gemma3_pt/logs
output_dir: /code/src/img_2_svg_pretraining/training/outputs/mn_gemma3_12b_siglip_gemma3_pt/checkpoints

checkpoint:
  resume: false
  path: null
  mode: weights_only

trainer:
  deepspeed: /code/src/img_2_svg_pretraining/training/configs/deepspeed/zero3_gemma.json

  num_train_epochs: 1

  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 2

  eval_strategy: "steps"
  eval_steps: 500
  save_strategy: "steps"
  save_steps: 1000
  save_total_limit: 3

  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine_with_min_lr"
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  warmup_steps: 200
  weight_decay: 0.0
  max_grad_norm: 1.0

  optim: "adamw_torch"
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-6

  bf16: true
  gradient_checkpointing: true

  logging_steps: 10
  dataloader_num_workers: 4
  report_to: "wandb"
  run_name: ${run_name}

loss:
  ce_loss_weight: 1.0

pretrain_init:
  reset_connector: true

param_groups:
  - pattern: "backbone\\.gemma\\.vision_tower\\."
    lr: 6.0e-6
    weight_decay: 0.0
  - pattern: "backbone\\.gemma\\.multi_modal_projector\\."
    lr: 2.0e-4
    weight_decay: 0.0
  - pattern: "backbone\\.gemma\\."
    lr: 2.0e-5
    weight_decay: 0.0

datasets:
  train:
    - name: pixmo_cap_local
      dataset_kwargs:
        data_path: /fsxvision_new/pratyush.jena/Datasets/pixmo-cap-images/extracted_dataset
        mode: captions
  val:
    - name: pixmo_cap_local
      dataset_kwargs:
        data_path: /fsxvision_new/pratyush.jena/Datasets/pixmo-cap-images/extracted_dataset
        mode: captions

captioning_eval:
  eval_steps: 500
  num_samples: 64
  max_new_tokens: 256
  do_sample: false
