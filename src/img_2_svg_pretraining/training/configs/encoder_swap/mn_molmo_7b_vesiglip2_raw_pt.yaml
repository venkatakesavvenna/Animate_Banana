# Molmo 7B | google/siglip2-so400m-patch14-384 (swap) | raw LM | Pre-Train
#
#   vision encoder  ← google/siglip2-so400m-patch14-384 (standalone swap)
#   connector       ← random N(0, 0.02)
#   text model      ← allenai/OLMo-7B-1024-preview (raw_llm)
#
# Nodes: 2

vlm_family: molmovlm
base_model: /fsxvision_new/anirudh.srinivasan/hf_cache/hub/models--allenai--Molmo-7B-O-0924/snapshots/7a8c4bf80c839c243a6908c6ebbb0f1ee576d7ca
model_family_name: molmo
attn_implementation: null
molmo_max_crops: 6

sam_version: none
out_dim: 256

run_name: "mn_molmo_7b_vesiglip2_raw_pt"
split_ratio: 0.995
seed: 42

wandb_project: img-2-svg-pretraining
logging_dir: /code/src/img_2_svg_pretraining/training/outputs/mn_molmo_7b_vesiglip2_raw_pt/logs
output_dir: /code/src/img_2_svg_pretraining/training/outputs/mn_molmo_7b_vesiglip2_raw_pt/checkpoints

checkpoint:
  resume: false
  path: null
  mode: weights_only

vision_encoder: siglip2
vision_encoder_checkpoint: /fsxvision_new/anirudh.srinivasan/hf_cache/hub/models--google--siglip2-so400m-patch14-384/snapshots/e8e487298228002f3d8a82e0cd5c8ea9c567f57f

trainer:
  deepspeed: /code/src/img_2_svg_pretraining/training/configs/deepspeed/zero3.json

  num_train_epochs: 1

  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 1

  eval_strategy: "steps"
  eval_steps: 500
  save_strategy: "steps"
  save_steps: 1000
  save_total_limit: 3

  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine_with_min_lr"
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  warmup_steps: 200
  weight_decay: 0.0
  max_grad_norm: 1.0

  optim: "adamw_torch"
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-6

  bf16: true
  gradient_checkpointing: true

  logging_steps: 10
  dataloader_num_workers: 4
  report_to: "wandb"
  run_name: ${run_name}

loss:
  ce_loss_weight: 1.0

pretrain_init:
  ve_init_mode: none
  reset_connector: true
  lm_init_mode: raw_llm
  lm_checkpoint: allenai/OLMo-7B-1024-preview

param_groups:
  - pattern: "backbone\\.molmo\\.model\\.vision_backbone\\.encoder\\."
    lr: 6.0e-6
    weight_decay: 0.0
  - pattern: "backbone\\.molmo\\.model\\.vision_backbone\\."
    lr: 2.0e-4
    weight_decay: 0.0
  - pattern: "backbone\\.molmo\\."
    lr: 2.0e-5
    weight_decay: 0.0

datasets:
  train:
    - name: pixmo_cap_local
      dataset_kwargs:
        data_path: /fsxvision_new/pratyush.jena/Datasets/pixmo-cap-images/extracted_dataset
        mode: captions
  val:
    - name: pixmo_cap_local
      dataset_kwargs:
        data_path: /fsxvision_new/pratyush.jena/Datasets/pixmo-cap-images/extracted_dataset
        mode: captions

captioning_eval:
  eval_steps: 500
  num_samples: 64
  max_new_tokens: 256
  do_sample: false
