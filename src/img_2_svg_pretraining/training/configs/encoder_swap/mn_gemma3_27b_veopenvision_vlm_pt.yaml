# Gemma3 27B | UCSC-VLAA/openvision-vit-large-patch14-224 (swap) | VLM LM | Pre-Train
#
#   vision encoder  ← UCSC-VLAA/openvision-vit-large-patch14-224 (standalone swap)
#   connector       ← random N(0, 0.02)
#   text model      ← from base_model VLM (from_vlm)
#
# Nodes: 2

vlm_family: gemmavlm
base_model: google/gemma-3-27b-it
model_family_name: gemma3
attn_implementation: eager

sam_version: none
out_dim: 256

run_name: "mn_gemma3_27b_veopenvision_vlm_pt"
split_ratio: 0.995
seed: 42

wandb_project: img-2-svg-pretraining
logging_dir: /code/src/img_2_svg_pretraining/training/outputs/mn_gemma3_27b_veopenvision_vlm_pt/logs
output_dir: /code/src/img_2_svg_pretraining/training/outputs/mn_gemma3_27b_veopenvision_vlm_pt/checkpoints

checkpoint:
  resume: false
  path: null
  mode: weights_only

vision_encoder: openvision
vision_encoder_checkpoint: /fsxvision_new/anirudh.srinivasan/hf_cache/hub/models--UCSC-VLAA--openvision-vit-large-patch14-224/snapshots/8586d8213024e2946cf1c7db6071d430a286cb5b
vision_encoder_arch: ViT-L-14

trainer:
  deepspeed: /code/src/img_2_svg_pretraining/training/configs/deepspeed/zero3_gemma.json

  num_train_epochs: 1

  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 2

  eval_strategy: "steps"
  eval_steps: 500
  save_strategy: "steps"
  save_steps: 1000
  save_total_limit: 3

  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine_with_min_lr"
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  warmup_steps: 200
  weight_decay: 0.0
  max_grad_norm: 1.0

  optim: "adamw_torch"
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-6

  bf16: true
  gradient_checkpointing: true

  logging_steps: 10
  dataloader_num_workers: 4
  report_to: "wandb"
  run_name: ${run_name}

loss:
  ce_loss_weight: 1.0

pretrain_init:
  ve_init_mode: none
  reset_connector: true
  lm_init_mode: from_vlm

param_groups:
  - pattern: "backbone\\.gemma\\.vision_tower\\.encoder\\."
    lr: 6.0e-6
    weight_decay: 0.0
  - pattern: "backbone\\.gemma\\.vision_tower\\."
    lr: 2.0e-4
    weight_decay: 0.0
  - pattern: "backbone\\.gemma\\."
    lr: 2.0e-5
    weight_decay: 0.0

datasets:
  train:
    - name: pixmo_cap_local
      dataset_kwargs:
        data_path: /fsxvision_new/pratyush.jena/Datasets/pixmo-cap-images/extracted_dataset
        mode: captions
  val:
    - name: pixmo_cap_local
      dataset_kwargs:
        data_path: /fsxvision_new/pratyush.jena/Datasets/pixmo-cap-images/extracted_dataset
        mode: captions

captioning_eval:
  eval_steps: 500
  num_samples: 64
  max_new_tokens: 256
  do_sample: false
