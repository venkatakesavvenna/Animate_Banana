# 1-step smoke test for the Molmo pre-training config.
# Mirrors molmo_pretrain.yaml but runs 1 step, 2 samples, no W&B, no DS.
vlm_family: molmovlm
base_model: /fsxvision_new/anirudh.srinivasan/hf_cache/hub/models--allenai--Molmo-7B-O-0924/snapshots/7a8c4bf80c839c243a6908c6ebbb0f1ee576d7ca
model_family_name: molmo
attn_implementation: null
sam_version: none
out_dim: 256
run_name: smoke_molmo_pt
split_ratio: 0.5
seed: 42
logging_dir: /tmp/smoke_molmo_pt/logs
output_dir: /tmp/smoke_molmo_pt/checkpoints

checkpoint:
  resume: false
  path: null
  mode: weights_only

trainer:
  max_steps: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  eval_strategy: "steps"
  eval_steps: 2
  save_strategy: "no"
  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine_with_min_lr"
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  warmup_steps: 0
  weight_decay: 0.0
  max_grad_norm: 1.0
  optim: "adamw_torch"
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-6
  bf16: true
  gradient_checkpointing: false
  logging_steps: 1
  dataloader_num_workers: 0
  report_to: "none"
  run_name: ${run_name}

loss:
  ce_loss_weight: 1.0

param_groups:
  - pattern: "backbone\\.molmo\\.model\\.vision_backbone\\.image_vit\\."
    lr: 6.0e-6
    weight_decay: 0.0
  - pattern: "backbone\\.molmo\\.model\\.vision_backbone\\."
    lr: 2.0e-4
    weight_decay: 0.0
  - pattern: "backbone\\.molmo\\.model\\."
    lr: 2.0e-5
    weight_decay: 0.0

datasets:
  train:
    - name: pixmo_cap_local
      dataset_kwargs:
        data_path: /fsxvision_new/pratyush.jena/Datasets/pixmo-cap-images/extracted_dataset
        mode: captions
        shards: ["00000"]
        sample_limit: 4
  val:
    - name: pixmo_cap_local
      dataset_kwargs:
        data_path: /fsxvision_new/pratyush.jena/Datasets/pixmo-cap-images/extracted_dataset
        mode: captions
        shards: ["00000"]
        sample_limit: 4
