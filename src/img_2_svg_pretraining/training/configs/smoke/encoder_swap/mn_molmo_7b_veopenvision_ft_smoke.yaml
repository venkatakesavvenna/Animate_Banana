vlm_family: molmovlm
base_model: /fsxvision_new/anirudh.srinivasan/hf_cache/hub/models--allenai--Molmo-7B-O-0924/snapshots/7a8c4bf80c839c243a6908c6ebbb0f1ee576d7ca
model_family_name: molmo
attn_implementation: null
molmo_max_crops: 6
sam_version: none
out_dim: 256
run_name: mn_molmo_7b_veopenvision_ft_smoke
split_ratio: 0.995
seed: 42
wandb_project: img-2-svg-pretraining-smoke
logging_dir: /code/src/img_2_svg_pretraining/training/outputs/mn_molmo_7b_veopenvision_ft_smoke/logs
output_dir: /code/src/img_2_svg_pretraining/training/outputs/mn_molmo_7b_veopenvision_ft_smoke/checkpoints
checkpoint:
  resume: false
  path: null
  mode: weights_only
vision_encoder: openvision
vision_encoder_checkpoint: /fsxvision_new/anirudh.srinivasan/hf_cache/hub/models--UCSC-VLAA--openvision-vit-large-patch14-224/snapshots/8586d8213024e2946cf1c7db6071d430a286cb5b
trainer:
  deepspeed: /code/src/img_2_svg_pretraining/training/configs/deepspeed/zero3.json
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 1
  eval_strategy: steps
  eval_steps: 50
  save_strategy: 'no'
  save_steps: 1000
  save_total_limit: 3
  learning_rate: 2.0e-05
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  warmup_steps: 200
  weight_decay: 0.0
  max_grad_norm: 1.0
  optim: adamw_torch
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-06
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  dataloader_num_workers: 4
  report_to: wandb
  run_name: ${run_name}
  max_steps: 200
loss:
  ce_loss_weight: 1.0
param_groups:
- pattern: backbone\.molmo\.model\.vision_backbone\.encoder\.
  lr: 5.0e-06
  weight_decay: 0.0
- pattern: backbone\.molmo\.model\.vision_backbone\.
  lr: 2.0e-05
  weight_decay: 0.0
- pattern: backbone\.molmo\.
  lr: 2.0e-05
  weight_decay: 0.0
datasets:
  train:
  - name: pixmo_cap_local
    dataset_kwargs:
      data_path: /fsxvision_new/pratyush.jena/Datasets/pixmo-cap-images/extracted_dataset
      mode: captions
  val:
  - name: pixmo_cap_local
    dataset_kwargs:
      data_path: /fsxvision_new/pratyush.jena/Datasets/pixmo-cap-images/extracted_dataset
      mode: captions
captioning_eval:
  eval_steps: 100
  num_samples: 16
  max_new_tokens: 64
  do_sample: false
