# VLM-only training + vision encoder swap smoke test.
# Verifies that sam_version: none + vision_encoder swap work together end-to-end.
# Note: skip_final_model_save avoids the HF safetensors shared-tensor issue that
# arises from Qwen's model.visual/visual alias after an encoder swap.
# For production VE swap training, add save_safetensors: false under trainer:.
vlm_family: qwenvlm
base_model: /fsxvision_new/anirudh.srinivasan/hf_cache/hub/models--Qwen--Qwen2.5-VL-7B-Instruct/snapshots/cc594898137f460bfe9f0759e9844b3ce807cfb5
model_family_name: qwen2.5vl
attn_implementation: flash_attention_2
sam_version: none
out_dim: 256
sam_image_size: 1024
run_name: smoke_qwen25_vlm_only_ve_swap
split_ratio: 0.5
seed: 42
logging_dir: /code/src/img_2_svg_pretraining/training/outputs/${run_name}/validation_steps
output_dir: /code/src/img_2_svg_pretraining/training/outputs/${run_name}/checkpoints

vision_encoder: siglip
vision_encoder_checkpoint: /fsxvision_new/anirudh.srinivasan/hf_cache/hub/models--google--siglip-so400m-patch14-384/snapshots/9fdffc58afc957d1a03a25b10dba0329ab15c2a3

skip_final_model_save: true

checkpoint:
  resume: false
  path: null
  mode: weights_only

trainer:
  max_steps: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  eval_strategy: "steps"
  eval_steps: 3
  save_strategy: "no"
  learning_rate: 1e-6
  weight_decay: 0.0
  warmup_ratio: 0.0
  max_grad_norm: 1.0
  lr_scheduler_type: "constant"
  logging_steps: 1
  bf16: true
  gradient_checkpointing: false
  dataloader_num_workers: 0
  report_to: "none"
  run_name: ${run_name}

loss:
  ce_loss_weight: 1.0

datasets:
  train:
    - name: doclaynet
      dataset_kwargs:
        data_path: ds4sd/DocLayNet-v1.2
        streaming: true
        sample_limit: 8

  val:
    - name: doclaynet

  eval:
    - name: doclaynet
