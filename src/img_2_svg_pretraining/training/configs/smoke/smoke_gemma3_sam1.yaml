vlm_family: gemmavlm
base_model: /fsxvision_new/anirudh.srinivasan/hf_cache/hub/models--google--gemma-3-4b-it/snapshots/093f9f388b31de276ce2de164bdc2081324b9767
model_family_name: gemma3
attn_implementation: eager
sam_version: sam1
sam_checkpoint: /fsxvision_new/srihari.bandarupalli/DocGrounding/checkpoints/sam_vit_h_4b8939.pth
out_dim: 256
sam_image_size: 1024
run_name: smoke_gemma3_sam1
split_ratio: 0.5
seed: 42
logging_dir: /code/src/img_2_svg_pretraining/training/outputs/${run_name}/validation_steps
output_dir: /code/src/img_2_svg_pretraining/training/outputs/${run_name}/checkpoints

checkpoint:
  resume: false
  path: null
  mode: weights_only

trainer:
  max_steps: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  eval_strategy: "steps"
  eval_steps: 3
  save_strategy: "no"
  learning_rate: 1e-6
  weight_decay: 0.0
  warmup_ratio: 0.0
  max_grad_norm: 1.0
  lr_scheduler_type: "constant"
  logging_steps: 1
  bf16: true
  gradient_checkpointing: true
  dataloader_num_workers: 0
  report_to: "none"
  run_name: ${run_name}
  deepspeed: /code/src/img_2_svg_pretraining/training/configs/deepspeed/zero3_gemma.json

loss:
  ce_loss_weight: 1.0
  bce_loss_weight: 1.0
  dice_loss_weight: 0.5

datasets:
  train:
    - name: doclaynet
      dataset_kwargs:
        data_path: ds4sd/DocLayNet-v1.2
        streaming: true
        sample_limit: 8

  val:
    - name: doclaynet

  eval:
    - name: doclaynet
