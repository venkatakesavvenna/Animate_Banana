# no need to set tensor_parallel_size here, in the vlm_service we are automatically putting it based on number of gpus
models:
  Qwen/Qwen3-VL-32B-Instruct:
    is_llm: false
    engine_args:
      limit_mm_per_prompt:
        image: 1
      gpu_memory_utilization: 0.95

  Qwen/Qwen3.6-27B:
    is_llm: false
    engine_args:
      max_model_len: 128000
      limit_mm_per_prompt:
        image: 1
      gpu_memory_utilization: 0.95

  Qwen/Qwen3.5-27B:
    is_llm: false
    engine_args:
      max_model_len: 32000
      limit_mm_per_prompt:
        image: 1
      gpu_memory_utilization: 0.95
      
  Qwen/Qwen3.5-4B:
    is_llm: false
    engine_args:
      limit_mm_per_prompt:
        image: 1
      gpu_memory_utilization: 0.95
      
  Qwen/Qwen3-14B:
    is_llm: true
    engine_args:
      max_model_len: 128000
      tensor_parallel_size: 8
      gpu_memory_utilization: 0.95

  Qwen/Qwen3-VL-235B-A22B-Instruct:
    is_llm: false
    engine_args:
      max_model_len: 128000
      limit_mm_per_prompt:
        image: 2
      gpu_memory_utilization: 0.95
      
