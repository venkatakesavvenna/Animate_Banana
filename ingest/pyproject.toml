[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-ingest"
version = "1.9.4"
description = "Vision Ingestion Engine - Scalable VLM inference pipeline"
readme = "QUICKSTART.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Srihari Bandarupalli"}
]

[project.urls]
Homepage = "https://github.com/Bharatgen-Tech/Patram-Ingest"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["vision_ingest*"]
exclude = ["*.tests", "*.tests.*", "tests.*", "tests"]
